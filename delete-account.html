const D={
en:{dir:"ltr",label:"Account & Data",title:"Delete your SilentHalos account",home:"Home",meta:"Request deletion of your SilentHalos account and associated personal data.",note:'For more information about how SilentHalos handles personal data, please read our <a href="privacy.html">Privacy Policy</a>.',rights:"© 2026 SilentHalos. All rights reserved.",privacy:"Privacy Policy",terms:"Terms & Conditions",sections:[
{title:"How to request account deletion",body:'<p>To request deletion of your SilentHalos account, send an email from the email address associated with your SilentHalos account to <a href="mailto:support@silenthalos.com?subject=SilentHalos%20Account%20Deletion%20Request">support@silenthalos.com</a>.</p><p>Please use the subject <strong>SilentHalos Account Deletion Request</strong> and include the email address associated with your account if it is different from the address you are sending from.</p><a class="delete-button" href="mailto:support@silenthalos.com?subject=SilentHalos%20Account%20Deletion%20Request">Request account deletion</a>'},
{title:"What will be deleted",body:"<p>After your request has been verified, we will process deletion of your SilentHalos account and personal data associated with that account that is held by SilentHalos.</p><p>This may include account and authentication information and emergency incident records associated with your account, including incident location data, audio recordings and camera evidence stored on our service infrastructure.</p>"},
{title:"Data stored on your device",body:"<p>Some SilentHalos information, including certain profile preferences and emergency contact information, may be stored locally on your device. Removing the application or clearing its local data may be required to remove locally stored information from that device.</p>"},
{title:"Retention and legal requirements",body:"<p>Emergency incident records are currently retained until deletion is requested because they may serve as important emergency evidence.</p><p>Where we are legally required to retain specific information, that information may be retained only for the period required by applicable law. Any such legally required retention is excluded from the deletion request until the applicable retention obligation ends.</p>"},
{title:"Need help?",body:'<p>SilentHalos is operated by <strong>Fenikia International</strong>, a sole proprietorship registered in the Netherlands.</p><p>For questions about account deletion or personal data, contact <a href="mailto:support@silenthalos.com">support@silenthalos.com</a>.</p>'}]},
nl:{dir:"ltr",label:"Account & Gegevens",title:"Uw SilentHalos-account verwijderen",home:"Home",meta:"Vraag verwijdering aan van uw SilentHalos-account en de bijbehorende persoonsgegevens.",note:'Lees ons <a href="privacy.html">Privacybeleid</a> voor meer informatie over hoe SilentHalos persoonsgegevens verwerkt.',rights:"© 2026 SilentHalos. Alle rechten voorbehouden.",privacy:"Privacybeleid",terms:"Algemene voorwaarden",sections:[
{title:"Hoe u accountverwijdering aanvraagt",body:'<p>Om verwijdering van uw SilentHalos-account aan te vragen, stuurt u vanaf het e-mailadres dat aan uw SilentHalos-account is gekoppeld een e-mail naar <a href="mailto:support@silenthalos.com?subject=SilentHalos%20Account%20Deletion%20Request">support@silenthalos.com</a>.</p><p>Gebruik als onderwerp <strong>SilentHalos Account Deletion Request</strong> en vermeld het e-mailadres van uw account als dit afwijkt van het adres waarmee u de e-mail verzendt.</p><a class="delete-button" href="mailto:support@silenthalos.com?subject=SilentHalos%20Account%20Deletion%20Request">Accountverwijdering aanvragen</a>'},
{title:"Wat wordt verwijderd",body:"<p>Nadat uw verzoek is geverifieerd, verwerken wij de verwijdering van uw SilentHalos-account en de bijbehorende persoonsgegevens die door SilentHalos worden bewaard.</p><p>Dit kan account- en authenticatiegegevens omvatten, evenals noodincidentgegevens die aan uw account zijn gekoppeld, waaronder locatiegegevens, audio-opnamen en camerabewijs die op onze service-infrastructuur zijn opgeslagen.</p>"},
{title:"Gegevens op uw apparaat",body:"<p>Sommige SilentHalos-gegevens, waaronder bepaalde profielvoorkeuren en informatie over noodcontacten, kunnen lokaal op uw apparaat worden opgeslagen. Het verwijderen van de app of wissen van de lokale gegevens kan nodig zijn om deze informatie van het apparaat te verwijderen.</p>"},
{title:"Bewaring en wettelijke vereisten",body:"<p>Gegevens van noodincidenten worden momenteel bewaard totdat om verwijdering wordt verzocht, omdat zij belangrijk bewijsmateriaal bij een noodsituatie kunnen vormen.</p><p>Wanneer wij wettelijk verplicht zijn specifieke informatie te bewaren, wordt deze uitsluitend bewaard gedurende de wettelijk vereiste periode. Deze gegevens vallen tot het einde van die verplichting buiten het verwijderingsverzoek.</p>"},
{title:"Hulp nodig?",body:'<p>SilentHalos wordt geëxploiteerd door <strong>Fenikia International</strong>, een eenmanszaak geregistreerd in Nederland.</p><p>Voor vragen over accountverwijdering of persoonsgegevens kunt u contact opnemen via <a href="mailto:support@silenthalos.com">support@silenthalos.com</a>.</p>'}]},
de:{dir:"ltr",label:"Konto & Daten",title:"Ihr SilentHalos-Konto löschen",home:"Startseite",meta:"Beantragen Sie die Löschung Ihres SilentHalos-Kontos und der damit verbundenen personenbezogenen Daten.",note:'Weitere Informationen zum Umgang von SilentHalos mit personenbezogenen Daten finden Sie in unserer <a href="privacy.html">Datenschutzerklärung</a>.',rights:"© 2026 SilentHalos. Alle Rechte vorbehalten.",privacy:"Datenschutzerklärung",terms:"Allgemeine Geschäftsbedingungen",sections:[
{title:"So beantragen Sie die Kontolöschung",body:'<p>Senden Sie zur Beantragung der Löschung Ihres SilentHalos-Kontos eine E-Mail von der mit Ihrem Konto verknüpften E-Mail-Adresse an <a href="mailto:support@silenthalos.com?subject=SilentHalos%20Account%20Deletion%20Request">support@silenthalos.com</a>.</p><p>Verwenden Sie den Betreff <strong>SilentHalos Account Deletion Request</strong> und geben Sie die mit Ihrem Konto verknüpfte E-Mail-Adresse an, falls sie von der Absenderadresse abweicht.</p><a class="delete-button" href="mailto:support@silenthalos.com?subject=SilentHalos%20Account%20Deletion%20Request">Kontolöschung beantragen</a>'},
{title:"Was gelöscht wird",body:"<p>Nach Überprüfung Ihrer Anfrage bearbeiten wir die Löschung Ihres SilentHalos-Kontos und der damit verbundenen personenbezogenen Daten, die von SilentHalos gespeichert werden.</p><p>Dazu können Konto- und Authentifizierungsinformationen sowie mit Ihrem Konto verbundene Notfalldaten gehören, einschließlich Standortdaten, Audioaufnahmen und Kamerabeweisen.</p>"},
{title:"Auf Ihrem Gerät gespeicherte Daten",body:"<p>Einige SilentHalos-Informationen, darunter bestimmte Profileinstellungen und Notfallkontakte, können lokal auf Ihrem Gerät gespeichert sein. Möglicherweise müssen Sie die App entfernen oder deren lokale Daten löschen, um diese Informationen vom Gerät zu entfernen.</p>"},
{title:"Aufbewahrung und gesetzliche Anforderungen",body:"<p>Notfallaufzeichnungen werden derzeit bis zu einem Löschantrag aufbewahrt, da sie als wichtiges Beweismaterial dienen können.</p><p>Wenn wir gesetzlich zur Aufbewahrung bestimmter Informationen verpflichtet sind, werden diese nur für den gesetzlich vorgeschriebenen Zeitraum aufbewahrt und bis zum Ende dieser Pflicht von der Löschung ausgenommen.</p>"},
{title:"Benötigen Sie Hilfe?",body:'<p>SilentHalos wird von <strong>Fenikia International</strong>, einem in den Niederlanden registrierten Einzelunternehmen, betrieben.</p><p>Bei Fragen zur Kontolöschung oder zu personenbezogenen Daten kontaktieren Sie <a href="mailto:support@silenthalos.com">support@silenthalos.com</a>.</p>'}]},
fr:{dir:"ltr",label:"Compte & Données",title:"Supprimer votre compte SilentHalos",home:"Accueil",meta:"Demandez la suppression de votre compte SilentHalos et des données personnelles associées.",note:'Pour en savoir plus sur la manière dont SilentHalos traite les données personnelles, consultez notre <a href="privacy.html">Politique de confidentialité</a>.',rights:"© 2026 SilentHalos. Tous droits réservés.",privacy:"Politique de confidentialité",terms:"Conditions générales",sections:[
{title:"Comment demander la suppression du compte",body:'<p>Pour demander la suppression de votre compte SilentHalos, envoyez un e-mail depuis l’adresse associée à votre compte à <a href="mailto:support@silenthalos.com?subject=SilentHalos%20Account%20Deletion%20Request">support@silenthalos.com</a>.</p><p>Utilisez l’objet <strong>SilentHalos Account Deletion Request</strong> et indiquez l’adresse e-mail associée à votre compte si elle diffère de l’adresse d’envoi.</p><a class="delete-button" href="mailto:support@silenthalos.com?subject=SilentHalos%20Account%20Deletion%20Request">Demander la suppression du compte</a>'},
{title:"Ce qui sera supprimé",body:"<p>Après vérification de votre demande, nous procéderons à la suppression de votre compte SilentHalos et des données personnelles associées détenues par SilentHalos.</p><p>Cela peut inclure les informations de compte et d’authentification ainsi que les dossiers d’incidents d’urgence associés, notamment les données de localisation, les enregistrements audio et les preuves photographiques.</p>"},
{title:"Données stockées sur votre appareil",body:"<p>Certaines informations SilentHalos, notamment certaines préférences de profil et les coordonnées des contacts d’urgence, peuvent être stockées localement sur votre appareil. La suppression de l’application ou de ses données locales peut être nécessaire pour les retirer de l’appareil.</p>"},
{title:"Conservation et obligations légales",body:"<p>Les dossiers d’incidents d’urgence sont actuellement conservés jusqu’à ce qu’une suppression soit demandée, car ils peuvent constituer des preuves importantes.</p><p>Lorsque la loi nous impose de conserver certaines informations, elles ne seront conservées que pendant la durée légalement requise et seront exclues de la suppression jusqu’à la fin de cette obligation.</p>"},
{title:"Besoin d’aide ?",body:'<p>SilentHalos est exploité par <strong>Fenikia International</strong>, une entreprise individuelle enregistrée aux Pays-Bas.</p><p>Pour toute question concernant la suppression du compte ou les données personnelles, contactez <a href="mailto:support@silenthalos.com">support@silenthalos.com</a>.</p>'}]},
es:{dir:"ltr",label:"Cuenta y Datos",title:"Eliminar tu cuenta de SilentHalos",home:"Inicio",meta:"Solicita la eliminación de tu cuenta de SilentHalos y de los datos personales asociados.",note:'Para obtener más información sobre cómo SilentHalos trata los datos personales, consulta nuestra <a href="privacy.html">Política de privacidad</a>.',rights:"© 2026 SilentHalos. Todos los derechos reservados.",privacy:"Política de privacidad",terms:"Términos y condiciones",sections:[
{title:"Cómo solicitar la eliminación",body:'<p>Para solicitar la eliminación de tu cuenta de SilentHalos, envía un correo electrónico desde la dirección asociada a tu cuenta a <a href="mailto:support@silenthalos.com?subject=SilentHalos%20Account%20Deletion%20Request">support@silenthalos.com</a>.</p><p>Utiliza el asunto <strong>SilentHalos Account Deletion Request</strong> e incluye la dirección de correo asociada a tu cuenta si es distinta de la dirección desde la que escribes.</p><a class="delete-button" href="mailto:support@silenthalos.com?subject=SilentHalos%20Account%20Deletion%20Request">Solicitar eliminación de la cuenta</a>'},
{title:"Qué se eliminará",body:"<p>Una vez verificada tu solicitud, procesaremos la eliminación de tu cuenta de SilentHalos y de los datos personales asociados que estén en poder de SilentHalos.</p><p>Esto puede incluir información de cuenta y autenticación y registros de incidentes de emergencia asociados, incluidos datos de ubicación, grabaciones de audio y pruebas de cámara.</p>"},
{title:"Datos almacenados en tu dispositivo",body:"<p>Parte de la información de SilentHalos, incluidas determinadas preferencias del perfil y los contactos de emergencia, puede almacenarse localmente en tu dispositivo. Puede ser necesario eliminar la aplicación o borrar sus datos locales para retirar esa información.</p>"},
{title:"Conservación y requisitos legales",body:"<p>Los registros de incidentes de emergencia se conservan actualmente hasta que se solicita su eliminación porque pueden servir como pruebas importantes.</p><p>Cuando exista una obligación legal de conservar información específica, esta se conservará únicamente durante el período exigido por la ley y quedará excluida de la eliminación hasta que finalice dicha obligación.</p>"},
{title:"¿Necesitas ayuda?",body:'<p>SilentHalos es operado por <strong>Fenikia International</strong>, una empresa individual registrada en los Países Bajos.</p><p>Para preguntas sobre eliminación de cuentas o datos personales, escribe a <a href="mailto:support@silenthalos.com">support@silenthalos.com</a>.</p>'}]},
it:{dir:"ltr",label:"Account e Dati",title:"Elimina il tuo account SilentHalos",home:"Home",meta:"Richiedi l’eliminazione del tuo account SilentHalos e dei dati personali associati.",note:'Per ulteriori informazioni su come SilentHalos tratta i dati personali, consulta la nostra <a href="privacy.html">Informativa sulla privacy</a>.',rights:"© 2026 SilentHalos. Tutti i diritti riservati.",privacy:"Informativa sulla privacy",terms:"Termini e condizioni",sections:[
{title:"Come richiedere l’eliminazione dell’account",body:'<p>Per richiedere l’eliminazione del tuo account SilentHalos, invia un’e-mail dall’indirizzo associato al tuo account a <a href="mailto:support@silenthalos.com?subject=SilentHalos%20Account%20Deletion%20Request">support@silenthalos.com</a>.</p><p>Utilizza come oggetto <strong>SilentHalos Account Deletion Request</strong> e indica l’indirizzo e-mail associato al tuo account se diverso da quello utilizzato per l’invio.</p><a class="delete-button" href="mailto:support@silenthalos.com?subject=SilentHalos%20Account%20Deletion%20Request">Richiedi eliminazione account</a>'},
{title:"Cosa verrà eliminato",body:"<p>Dopo la verifica della richiesta, procederemo all’eliminazione del tuo account SilentHalos e dei dati personali associati detenuti da SilentHalos.</p><p>Ciò può includere informazioni sull’account e sull’autenticazione e registrazioni degli incidenti di emergenza associate, inclusi dati sulla posizione, registrazioni audio e prove fotografiche.</p>"},
{title:"Dati memorizzati sul dispositivo",body:"<p>Alcune informazioni di SilentHalos, comprese determinate preferenze del profilo e informazioni sui contatti di emergenza, possono essere memorizzate localmente sul dispositivo. Potrebbe essere necessario rimuovere l’app o cancellarne i dati locali.</p>"},
{title:"Conservazione e requisiti legali",body:"<p>I registri degli incidenti di emergenza sono attualmente conservati fino alla richiesta di eliminazione perché possono costituire importanti prove di emergenza.</p><p>Quando siamo legalmente obbligati a conservare determinate informazioni, queste saranno conservate solo per il periodo previsto dalla legge ed escluse dalla cancellazione fino alla fine di tale obbligo.</p>"},
{title:"Hai bisogno di aiuto?",body:'<p>SilentHalos è gestito da <strong>Fenikia International</strong>, un’impresa individuale registrata nei Paesi Bassi.</p><p>Per domande sull’eliminazione dell’account o sui dati personali, contatta <a href="mailto:support@silenthalos.com">support@silenthalos.com</a>.</p>'}]},
ru:{dir:"ltr",label:"Аккаунт и данные",title:"Удаление аккаунта SilentHalos",home:"Главная",meta:"Запросите удаление аккаунта SilentHalos и связанных с ним персональных данных.",note:'Подробнее об обработке персональных данных см. в нашей <a href="privacy.html">Политике конфиденциальности</a>.',rights:"© 2026 SilentHalos. Все права защищены.",privacy:"Политика конфиденциальности",terms:"Условия использования",sections:[
{title:"Как запросить удаление аккаунта",body:'<p>Чтобы запросить удаление аккаунта SilentHalos, отправьте письмо с адреса электронной почты, связанного с аккаунтом, на <a href="mailto:support@silenthalos.com?subject=SilentHalos%20Account%20Deletion%20Request">support@silenthalos.com</a>.</p><p>Укажите тему <strong>SilentHalos Account Deletion Request</strong> и адрес электронной почты вашего аккаунта, если он отличается от адреса отправителя.</p><a class="delete-button" href="mailto:support@silenthalos.com?subject=SilentHalos%20Account%20Deletion%20Request">Запросить удаление аккаунта</a>'},
{title:"Что будет удалено",body:"<p>После проверки запроса мы обработаем удаление вашего аккаунта SilentHalos и связанных с ним персональных данных, находящихся у SilentHalos.</p><p>Это может включать данные аккаунта и аутентификации, а также связанные записи чрезвычайных происшествий, включая данные о местоположении, аудиозаписи и материалы камеры.</p>"},
{title:"Данные на вашем устройстве",body:"<p>Некоторая информация SilentHalos, включая отдельные настройки профиля и сведения об экстренных контактах, может храниться локально на вашем устройстве. Для её удаления может потребоваться удалить приложение или очистить его локальные данные.</p>"},
{title:"Хранение и требования закона",body:"<p>Записи чрезвычайных происшествий в настоящее время хранятся до получения запроса на удаление, поскольку они могут служить важными доказательствами.</p><p>Если закон требует хранения определённой информации, она будет храниться только в течение установленного законом периода и не будет удалена до окончания соответствующей обязанности.</p>"},
{title:"Нужна помощь?",body:'<p>Оператором SilentHalos является <strong>Fenikia International</strong> — индивидуальное предприятие, зарегистрированное в Нидерландах.</p><p>По вопросам удаления аккаунта или персональных данных обращайтесь по адресу <a href="mailto:support@silenthalos.com">support@silenthalos.com</a>.</p>'}]},
tr:{dir:"ltr",label:"Hesap ve Veriler",title:"SilentHalos hesabınızı silin",home:"Ana Sayfa",meta:"SilentHalos hesabınızın ve ilişkili kişisel verilerin silinmesini talep edin.",note:'SilentHalos’un kişisel verileri nasıl işlediği hakkında daha fazla bilgi için <a href="privacy.html">Gizlilik Politikamızı</a> okuyun.',rights:"© 2026 SilentHalos. Tüm hakları saklıdır.",privacy:"Gizlilik Politikası",terms:"Şartlar ve Koşullar",sections:[
{title:"Hesap silme talebi nasıl yapılır",body:'<p>SilentHalos hesabınızın silinmesini talep etmek için hesabınızla ilişkili e-posta adresinden <a href="mailto:support@silenthalos.com?subject=SilentHalos%20Account%20Deletion%20Request">support@silenthalos.com</a> adresine e-posta gönderin.</p><p>Konu olarak <strong>SilentHalos Account Deletion Request</strong> yazın ve gönderdiğiniz adres farklıysa hesabınızla ilişkili e-posta adresini belirtin.</p><a class="delete-button" href="mailto:support@silenthalos.com?subject=SilentHalos%20Account%20Deletion%20Request">Hesap silme talebi gönder</a>'},
{title:"Neler silinecek",body:"<p>Talebiniz doğrulandıktan sonra SilentHalos hesabınızın ve SilentHalos tarafından tutulan ilişkili kişisel verilerin silinmesini işleyeceğiz.</p><p>Bunlar hesap ve kimlik doğrulama bilgileri ile konum verileri, ses kayıtları ve kamera kanıtları dahil hesabınızla ilişkili acil durum kayıtlarını içerebilir.</p>"},
{title:"Cihazınızda saklanan veriler",body:"<p>Bazı SilentHalos bilgileri, belirli profil tercihleri ve acil durum iletişim bilgileri dahil olmak üzere cihazınızda yerel olarak saklanabilir. Bu bilgileri cihazdan kaldırmak için uygulamayı kaldırmanız veya yerel verilerini temizlemeniz gerekebilir.</p>"},
{title:"Saklama ve yasal gereklilikler",body:"<p>Acil durum kayıtları, önemli acil durum kanıtı olabilecekleri için silme talep edilene kadar saklanmaktadır.</p><p>Belirli bilgileri yasal olarak saklamamız gerektiğinde, bunlar yalnızca yürürlükteki yasaların gerektirdiği süre boyunca saklanacak ve ilgili yükümlülük sona erene kadar silme kapsamı dışında tutulacaktır.</p>"},
{title:"Yardıma mı ihtiyacınız var?",body:'<p>SilentHalos, Hollanda’da kayıtlı bir şahıs işletmesi olan <strong>Fenikia International</strong> tarafından işletilmektedir.</p><p>Hesap silme veya kişisel verilerle ilgili sorular için <a href="mailto:support@silenthalos.com">support@silenthalos.com</a> adresine ulaşın.</p>'}]},
zh:{dir:"ltr",label:"账户与数据",title:"删除您的 SilentHalos 账户",home:"主页",meta:"申请删除您的 SilentHalos 账户及相关个人数据。",note:'有关 SilentHalos 如何处理个人数据的更多信息，请阅读我们的<a href="privacy.html">隐私政策</a>。',rights:"© 2026 SilentHalos。保留所有权利。",privacy:"隐私政策",terms:"条款与条件",sections:[
{title:"如何申请删除账户",body:'<p>如需申请删除 SilentHalos 账户，请使用与您的 SilentHalos 账户关联的电子邮件地址发送邮件至 <a href="mailto:support@silenthalos.com?subject=SilentHalos%20Account%20Deletion%20Request">support@silenthalos.com</a>。</p><p>请使用主题 <strong>SilentHalos Account Deletion Request</strong>；如果发件地址与账户关联地址不同，请在邮件中注明账户关联的电子邮件地址。</p><a class="delete-button" href="mailto:support@silenthalos.com?subject=SilentHalos%20Account%20Deletion%20Request">申请删除账户</a>'},
{title:"将删除哪些内容",body:"<p>您的请求通过验证后，我们将处理删除您的 SilentHalos 账户以及 SilentHalos 持有的与该账户相关的个人数据。</p><p>这可能包括账户和身份验证信息，以及与账户关联的紧急事件记录，包括事件位置数据、录音和摄像证据。</p>"},
{title:"存储在设备上的数据",body:"<p>部分 SilentHalos 信息（包括某些个人资料偏好和紧急联系人信息）可能存储在您的设备本地。要从设备中删除这些信息，可能需要卸载应用或清除其本地数据。</p>"},
{title:"保留与法律要求",body:"<p>紧急事件记录目前会保留至用户提出删除请求，因为这些记录可能构成重要的紧急事件证据。</p><p>如法律要求我们保留特定信息，该信息仅会在适用法律要求的期限内保留，并在相关法定保留义务结束前不纳入删除范围。</p>"},
{title:"需要帮助？",body:'<p>SilentHalos 由在荷兰注册的独资企业 <strong>Fenikia International</strong> 运营。</p><p>如对账户删除或个人数据有疑问，请联系 <a href="mailto:support@silenthalos.com">support@silenthalos.com</a>。</p>'}]},
ur:{dir:"rtl",label:"اکاؤنٹ اور ڈیٹا",title:"اپنا SilentHalos اکاؤنٹ حذف کریں",home:"ہوم",meta:"اپنے SilentHalos اکاؤنٹ اور اس سے منسلک ذاتی ڈیٹا کو حذف کرنے کی درخواست کریں۔",note:'SilentHalos ذاتی ڈیٹا کو کس طرح سنبھالتا ہے، اس بارے میں مزید معلومات کے لیے ہماری <a href="privacy.html">رازداری کی پالیسی</a> پڑھیں۔',rights:"© 2026 SilentHalos۔ جملہ حقوق محفوظ ہیں۔",privacy:"رازداری کی پالیسی",terms:"شرائط و ضوابط",sections:[
{title:"اکاؤنٹ حذف کرنے کی درخواست کیسے کریں",body:'<p>اپنا SilentHalos اکاؤنٹ حذف کرنے کی درخواست کے لیے اپنے اکاؤنٹ سے منسلک ای میل پتے سے <a href="mailto:support@silenthalos.com?subject=SilentHalos%20Account%20Deletion%20Request">support@silenthalos.com</a> پر ای میل بھیجیں۔</p><p>موضوع میں <strong>SilentHalos Account Deletion Request</strong> لکھیں، اور اگر بھیجنے والا ای میل پتہ مختلف ہے تو اپنے اکاؤنٹ سے منسلک ای میل پتہ بھی درج کریں۔</p><a class="delete-button" href="mailto:support@silenthalos.com?subject=SilentHalos%20Account%20Deletion%20Request">اکاؤنٹ حذف کرنے کی درخواست</a>'},
{title:"کیا حذف کیا جائے گا",body:"<p>آپ کی درخواست کی تصدیق کے بعد، ہم آپ کے SilentHalos اکاؤنٹ اور SilentHalos کے پاس موجود اس اکاؤنٹ سے منسلک ذاتی ڈیٹا کو حذف کرنے کا عمل شروع کریں گے۔</p><p>اس میں اکاؤنٹ اور توثیقی معلومات، اور آپ کے اکاؤنٹ سے منسلک ہنگامی واقعات کے ریکارڈ شامل ہو سکتے ہیں، جن میں مقام، آڈیو ریکارڈنگ اور کیمرہ ثبوت شامل ہیں۔</p>"},
{title:"آپ کے آلے پر محفوظ ڈیٹا",body:"<p>SilentHalos کی کچھ معلومات، بشمول بعض پروفائل ترجیحات اور ہنگامی رابطوں کی معلومات، آپ کے آلے پر مقامی طور پر محفوظ ہو سکتی ہیں۔ انہیں ہٹانے کے لیے ایپ حذف کرنا یا اس کا مقامی ڈیٹا صاف کرنا ضروری ہو سکتا ہے۔</p>"},
{title:"ڈیٹا برقرار رکھنا اور قانونی تقاضے",body:"<p>ہنگامی واقعات کے ریکارڈ فی الحال حذف کرنے کی درخواست تک محفوظ رکھے جاتے ہیں کیونکہ وہ اہم ہنگامی ثبوت ہو سکتے ہیں۔</p><p>جہاں قانون ہمیں مخصوص معلومات محفوظ رکھنے کا پابند کرتا ہے، وہ معلومات صرف قانون کے تقاضے کے مطابق مدت تک محفوظ رکھی جائیں گی اور اس ذمہ داری کے اختتام تک حذف کرنے کی درخواست سے مستثنیٰ ہوں گی۔</p>"},
{title:"مدد چاہیے؟",body:'<p>SilentHalos کو نیدرلینڈز میں رجسٹرڈ واحد ملکیت <strong>Fenikia International</strong> چلاتی ہے۔</p><p>اکاؤنٹ حذف کرنے یا ذاتی ڈیٹا کے متعلق سوالات کے لیے <a href="mailto:support@silenthalos.com">support@silenthalos.com</a> سے رابطہ کریں۔</p>'}]},
ar:{dir:"rtl",label:"الحساب والبيانات",title:"حذف حساب SilentHalos",home:"الرئيسية",meta:"اطلب حذف حسابك في SilentHalos والبيانات الشخصية المرتبطة به.",note:'لمزيد من المعلومات حول كيفية تعامل SilentHalos مع البيانات الشخصية، يرجى قراءة <a href="privacy.html">سياسة الخصوصية</a>.',rights:"© 2026 SilentHalos. جميع الحقوق محفوظة.",privacy:"سياسة الخصوصية",terms:"الشروط والأحكام",sections:[
{title:"كيفية طلب حذف الحساب",body:'<p>لطلب حذف حسابك في SilentHalos، أرسل رسالة بريد إلكتروني من عنوان البريد الإلكتروني المرتبط بحسابك إلى <a href="mailto:support@silenthalos.com?subject=SilentHalos%20Account%20Deletion%20Request">support@silenthalos.com</a>.</p><p>يرجى استخدام عنوان الرسالة <strong>SilentHalos Account Deletion Request</strong> وذكر عنوان البريد الإلكتروني المرتبط بحسابك إذا كان مختلفاً عن العنوان الذي ترسل منه الرسالة.</p><a class="delete-button" href="mailto:support@silenthalos.com?subject=SilentHalos%20Account%20Deletion%20Request">طلب حذف الحساب</a>'},
{title:"ما الذي سيتم حذفه",body:"<p>بعد التحقق من طلبك، سنقوم بمعالجة حذف حساب SilentHalos والبيانات الشخصية المرتبطة بذلك الحساب والمحفوظة لدى SilentHalos.</p><p>قد يشمل ذلك معلومات الحساب والمصادقة وسجلات حوادث الطوارئ المرتبطة بحسابك، بما في ذلك بيانات موقع الحادث والتسجيلات الصوتية وأدلة الكاميرا المخزنة ضمن البنية التحتية لخدماتنا.</p>"},
{title:"البيانات المخزنة على جهازك",body:"<p>قد يتم تخزين بعض معلومات SilentHalos محلياً على جهازك، بما في ذلك بعض تفضيلات الملف الشخصي ومعلومات جهات اتصال الطوارئ. وقد يلزم إزالة التطبيق أو مسح بياناته المحلية لإزالة هذه المعلومات من الجهاز.</p>"},
{title:"الاحتفاظ بالبيانات والمتطلبات القانونية",body:"<p>يتم حالياً الاحتفاظ بسجلات حوادث الطوارئ إلى أن يتم طلب حذفها، لأنها قد تشكل أدلة مهمة مرتبطة بحالة طوارئ.</p><p>عندما نكون ملزمين قانونياً بالاحتفاظ بمعلومات محددة، فقد يتم الاحتفاظ بهذه المعلومات فقط للمدة التي يفرضها القانون المعمول به، وتُستثنى من طلب الحذف حتى انتهاء الالتزام القانوني المتعلق بالاحتفاظ بها.</p>"},
{title:"هل تحتاج إلى مساعدة؟",body:'<p>يتم تشغيل SilentHalos بواسطة <strong>Fenikia International</strong>، وهي منشأة فردية مسجلة في هولندا.</p><p>لأي أسئلة حول حذف الحساب أو البيانات الشخصية، تواصل معنا عبر <a href="mailto:support@silenthalos.com">support@silenthalos.com</a>.</p>'}]}
};

const saved=localStorage.getItem("silenthalos-language"),b=(navigator.language||"en").toLowerCase().split("-")[0];A(saved&&D[saved]?saved:(D[b]?b:"en"));s.addEventListener("change",e=>A(e.target.value));
