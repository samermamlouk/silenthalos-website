<!DOCTYPE html><html lang="en" dir="ltr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Privacy Policy – SilentHalos</title><link rel="stylesheet" href="style.css"><style>
.legal-shell{width:min(880px,92%);margin:0 auto;padding:48px 0 80px}.legal-toolbar{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:28px;flex-wrap:wrap}.legal-language{min-height:42px;padding:0 13px;border-radius:999px;border:1px solid var(--card-border);background:#0b1b2e;color:var(--text-primary);font:inherit;font-size:12px;font-weight:800;cursor:pointer}.legal-eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-blue);margin:0 0 14px}.legal-title{font-size:clamp(30px,5vw,46px);font-weight:900;letter-spacing:-.03em;color:var(--text-primary);margin:0;line-height:1.1}.legal-meta{color:var(--text-secondary);font-size:14px;margin:0 0 34px;line-height:1.6}.legal-section{margin-bottom:16px;padding:26px 28px;border-radius:20px;background:var(--card-bg);border:1px solid var(--card-border)}.legal-section h2{font-size:15px;font-weight:800;color:var(--accent-blue);margin:0 0 12px;text-transform:uppercase;letter-spacing:.03em;line-height:1.35}.legal-section p,.legal-section li{color:var(--text-secondary);font-size:14px;line-height:1.75}.legal-section p{margin:0 0 10px}.legal-section p:last-child{margin-bottom:0}.legal-section ul{margin:8px 0 10px;padding-left:20px}.legal-section li{margin-bottom:6px}.legal-section a,.legal-footer a{color:var(--accent-blue);text-decoration:none}.legal-disclaimer{border-color:rgba(239,68,68,.35);background:linear-gradient(145deg,rgba(80,10,10,.25),var(--card-bg))}.legal-disclaimer h2{color:var(--accent-red)}.legal-note{margin:24px 0 0;padding:14px 16px;border-radius:14px;border:1px solid var(--card-border);color:var(--text-secondary);font-size:12px;line-height:1.6;background:rgba(255,255,255,.025)}.legal-footer{margin-top:38px;padding-top:24px;border-top:1px solid var(--card-border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;color:var(--text-secondary);font-size:13px}.legal-footer-links{display:flex;gap:20px;flex-wrap:wrap}html[dir=rtl] body{direction:rtl;text-align:right}html[dir=rtl] .legal-section ul{padding-left:0;padding-right:20px}@media(max-width:600px){.legal-shell{padding:32px 0 60px}.legal-section{padding:20px 18px}.legal-footer{flex-direction:column;align-items:flex-start}.legal-language{width:100%}}</style></head>
<body class="incident-body"><header class="site-header"><a class="site-brand" href="/" style="text-decoration:none;"><img src="ChatGPT Image Jun 6, 2026, 03_10_08 PM.png" alt="SilentHalos logo" class="brand-logo"><span>SilentHalos</span></a><a href="/" class="about-link" id="topHome">← Home</a></header><main class="legal-shell"><div class="legal-toolbar"><div><p class="legal-eyebrow" id="lbl">Legal</p><h1 class="legal-title" id="ttl">Privacy Policy</h1></div><select id="lang" class="legal-language"><option value="en">EN · English</option><option value="nl">NL · Nederlands</option><option value="de">DE · Deutsch</option><option value="fr">FR · Français</option><option value="es">ES · Español</option><option value="it">IT · Italiano</option><option value="ru">RU · Русский</option><option value="tr">TR · Türkçe</option><option value="zh">ZH · 中文</option><option value="ur">UR · اردو</option><option value="ar">AR · العربية</option></select></div><p class="legal-meta" id="meta"></p><div id="sections"></div><p class="legal-note" id="note"></p><footer class="legal-footer"><span id="rights"></span><div class="legal-footer-links"><a href="/privacy" id="pl"></a><a href="/terms" id="tl"></a><a href="/" id="bh"></a></div></footer></main>
<script>const D={"en": {"dir": "ltr", "legal": "Legal", "title": "Privacy Policy", "home": "Home", "meta": "Last updated: August 2026 · Applies to the SilentHalos mobile application and associated web services.", "note": "The English version is the controlling legal text. Other languages are convenience translations.", "rights": "© 2026 SilentHalos. All rights reserved.", "privacy": "Privacy Policy", "terms": "Terms & Conditions", "sections": [{"title": "1. Information We Collect", "body": "<p>SilentHalos collects information that is necessary to provide emergency safety functionality. The types of information we may process include:</p><ul>\n<li><strong>Profile information</strong> — your name as entered in the app and, if you choose to set one, a profile photo stored locally on your device.</li>\n<li><strong>Device information</strong> — device model, operating system version, and a device identifier where technically required for the operation of the service.</li>\n<li><strong>GPS and location data</strong> — your real-time geographic coordinates, accuracy radius, speed, and heading, collected during an active emergency or when protection mode is enabled.</li>\n<li><strong>Emergency incident data</strong> — information associated with a triggered SOS event, including timestamps, trigger type, and incident status.</li>\n<li><strong>Device telemetry</strong> — battery level, network type, and GPS signal status, recorded as part of an emergency incident.</li>\n<li><strong>Audio recordings</strong> — audio captured by your device microphone during an active SOS event, stored as emergency evidence.</li>\n<li><strong>Camera photos</strong> — images captured by the front and rear cameras of your device during an active SOS event, stored as emergency evidence.</li>\n<li><strong>Emergency contact information</strong> — names and phone numbers of trusted contacts you add to the app, used solely to send emergency notifications.</li>\n<li><strong>Technical service data</strong> — information required for Firebase services to operate, such as authentication tokens and network request logs.</li></ul>"}, {"title": "2. How We Use Information", "body": "<p>Information collected by SilentHalos is used exclusively for the following purposes:</p><ul>\n<li>Providing the emergency safety and SOS alert functionality of the application.</li><li>Sending emergency notifications (SMS) to your designated trusted contacts.</li><li>Creating and storing a secure incident record accessible via the SilentHalos incident web page.</li><li>Displaying your live location, audio evidence, and photo evidence on the incident page shared with your emergency contacts.</li><li>Maintaining your account preferences and settings on your device.</li><li>Improving the reliability of the application through technical diagnostics.</li></ul><p>We do not use your information for advertising, profiling, or any purpose unrelated to emergency safety functionality.</p>"}, {"title": "3. Emergency Data Processing", "body": "<p>Certain categories of data — including location coordinates, audio recordings, and photos — are collected and processed <strong>only when SilentHalos protection mode is active or when an SOS event is triggered</strong>. This data is uploaded to Firebase services to create a secure, real-time incident record.</p><p>The purpose of this processing is exclusively to provide emergency evidence and to enable your trusted contacts to locate and assist you during an emergency situation.</p>"}, {"title": "4. Location Data", "body": "<p>SilentHalos requires access to your device's GPS and network location to provide live emergency location sharing. Location data is used to:</p><ul><li>Show your real-time position on the incident page shared with your emergency contacts.</li><li>Record location trail and accuracy information as part of the incident record.</li></ul><p>Location data is not collected in the background for any purpose other than active emergency protection. It is not used for advertising or sold to third parties.</p>"}, {"title": "5. Camera and Microphone", "body": "<p>SilentHalos requests access to your device camera and microphone exclusively for emergency safety purposes:</p><ul><li><strong>Microphone</strong> — used to record audio evidence during an active SOS event. Audio is not recorded continuously outside of an emergency.</li><li><strong>Camera</strong> — used to capture front and rear photos at the moment an SOS event is triggered. The camera is not used for any other purpose.</li></ul><p>These permissions are not used for advertising, analytics, or any purpose beyond emergency evidence capture.</p>"}, {"title": "6. Emergency Contacts", "body": "<p>You may add up to three trusted emergency contacts within the app. The names and phone numbers you provide are stored locally on your device and used solely to send an emergency SMS notification when an SOS event is triggered. Emergency contact information is not shared with third parties, uploaded to our servers, or used for any purpose other than sending emergency alerts.</p>"}, {"title": "7. Firebase and Service Providers", "body": "<p>SilentHalos uses Google Firebase services to store and deliver emergency incident data. This includes:</p><ul><li><strong>Firebase Firestore</strong> — stores incident records including location, status, and telemetry data.</li><li><strong>Firebase Storage</strong> — stores audio recordings and photos captured during an SOS event.</li><li><strong>Firebase Hosting</strong> — serves the SilentHalos website and public incident pages.</li></ul><p>Data stored via Firebase is subject to Google's privacy and security practices. We do not share your emergency data with any other third parties unless required by applicable law.</p>"}, {"title": "8. Data Storage and Security", "body": "<p>Emergency incident data is stored on Google Firebase infrastructure. We implement reasonable technical measures to protect data from unauthorised access. Incident pages are accessible via a unique incident identifier and are intended to be shared only with your emergency contacts.</p><p>Profile preferences and emergency contacts are stored locally on your device using secure on-device storage.</p>"}, {"title": "9. Data Retention", "body": "<p>Emergency incident records — including location data, audio recordings, and photos — are stored in Firebase until you or an authorised party requests deletion. We do not currently apply automatic expiry to incident records, as they may serve as important evidence.</p><p>If you wish to have your incident data removed, please contact us using the details in Section 14.</p>"}, {"title": "10. Your Rights (GDPR)", "body": "<p>If you are located in the European Economic Area (EEA), including the Netherlands, you have the following rights in relation to your personal data:</p><ul><li><strong>Right of access</strong> — you may request a copy of the personal data we hold about you.</li><li><strong>Right to rectification</strong> — you may ask us to correct inaccurate data.</li><li><strong>Right to erasure</strong> — you may request deletion of your personal data, subject to applicable legal requirements.</li><li><strong>Right to restriction</strong> — you may ask us to limit how we use your data in certain circumstances.</li><li><strong>Right to data portability</strong> — you may request your data in a structured, machine-readable format.</li><li><strong>Right to object</strong> — you may object to certain types of processing.</li></ul><p>To exercise any of these rights, please contact us at <a href=\"mailto:support@silenthalos.com\">support@silenthalos.com</a>.</p>"}, {"title": "11. Children and Age Requirements", "body": "<p>SilentHalos is not directed at children under the age of 16. We do not knowingly collect personal data from users under 16 years of age without verifiable parental consent. If you believe a child has provided personal data through SilentHalos, please contact us and we will take appropriate action.</p>"}, {"title": "12. International Data Processing", "body": "<p>SilentHalos is developed and operated from the Netherlands. Emergency incident data is stored on Google Firebase infrastructure, which may involve processing in data centres outside the EEA. Google maintains Standard Contractual Clauses and other safeguards for international data transfers in accordance with GDPR requirements.</p>"}, {"title": "13. Changes to This Privacy Policy", "body": "<p>We may update this Privacy Policy from time to time. When we make material changes, we will update the \"Last updated\" date at the top of this page. We encourage you to review this policy periodically. Continued use of SilentHalos after changes are published constitutes acceptance of the updated policy.</p>"}, {"title": "14. Contact", "body": "<p>SilentHalos is operated by <strong>Fenikia International</strong>, a sole proprietorship registered in the Netherlands.</p><p>For privacy-related questions, data requests, or concerns, please contact us:</p><ul><li>Website: <a href=\"https://silenthalos.com\">silenthalos.com</a></li><li>Email: <a href=\"mailto:support@silenthalos.com\">support@silenthalos.com</a></li></ul>"}]}, "nl": {"dir": "ltr", "legal": "Juridisch", "title": "Privacybeleid", "home": "Home", "meta": "Laatst bijgewerkt: augustus 2026 · Van toepassing op de SilentHalos-app en bijbehorende webdiensten.", "note": "De Engelse versie is juridisch leidend. Andere talen zijn vertalingen voor gebruiksgemak.", "rights": "© 2026 SilentHalos. Alle rechten voorbehouden.", "privacy": "Privacybeleid", "terms": "Algemene voorwaarden", "sections": [{"title": "1. Informatie die wij verzamelen", "body": "<p>SilentHalos verwerkt alleen gegevens die nodig zijn voor de veiligheids- en noodfuncties. Dit kan profiel- en apparaatinformatie, GPS- en locatiegegevens, incidentgegevens, batterij/netwerk/GPS-telemetrie, audio-opnamen, camerafoto’s, noodcontacten en technische servicegegevens omvatten. Een optionele profielfoto blijft lokaal op uw apparaat.</p>"}, {"title": "2. Hoe wij informatie gebruiken", "body": "<p>Wij gebruiken deze gegevens uitsluitend om SOS- en veiligheidsfuncties te leveren, vertrouwde contacten te waarschuwen, een beveiligd incidentdossier te maken, beschikbare locatie/audio/foto-informatie te tonen, instellingen te bewaren en technische betrouwbaarheid te verbeteren. Geen advertenties of profilering.</p>"}, {"title": "3. Verwerking van noodgegevens", "body": "<p>Locatie, audio en foto’s worden alleen verwerkt wanneer bescherming actief is of een SOS wordt geactiveerd. Zij kunnen naar Firebase worden geüpload om een beveiligd realtime incidentdossier te maken en uw vertrouwde contacten te helpen u te lokaliseren en ondersteunen.</p>"}, {"title": "4. Locatiegegevens", "body": "<p>GPS- en netwerklocatie worden gebruikt voor live noodlocatie, locatiegeschiedenis en nauwkeurigheidsinformatie binnen het incident. Locatiegegevens worden niet voor advertenties gebruikt of verkocht.</p>"}, {"title": "5. Camera en microfoon", "body": "<p>De microfoon wordt alleen gebruikt voor audio tijdens een actieve SOS. De camera wordt alleen gebruikt om, waar technisch mogelijk en toegestaan, voor- en achterfoto’s tijdens een SOS vast te leggen. Deze machtigingen worden niet voor advertenties of marketinganalyses gebruikt.</p>"}, {"title": "6. Noodcontacten", "body": "<p>U kunt maximaal drie vertrouwde noodcontacten toevoegen. Namen en telefoonnummers worden lokaal opgeslagen en alleen gebruikt om noodmeldingen/SMS te verzenden.</p>"}, {"title": "7. Firebase en dienstverleners", "body": "<p>SilentHalos gebruikt Google Firebase: Firestore voor incidentgegevens, Storage voor audio en foto’s en Hosting voor website en incidentpagina’s. Firebase-gegevens vallen ook onder de privacy- en beveiligingspraktijken van Google. Wij delen noodgegevens alleen wanneer de wet dit vereist.</p>"}, {"title": "8. Opslag en beveiliging", "body": "<p>Incidentgegevens worden op Google Firebase-infrastructuur opgeslagen. Wij nemen redelijke technische maatregelen tegen onbevoegde toegang. Incidentpagina’s gebruiken een unieke incident-ID en zijn bedoeld voor uw vertrouwde contacten. Profielvoorkeuren en noodcontacten blijven lokaal op uw apparaat.</p>"}, {"title": "9. Bewaartermijn", "body": "<p>Incidentgegevens, waaronder locatie, audio en foto’s, blijven bewaard totdat u of een bevoegde partij verwijdering verzoekt. Momenteel is er geen automatische vervaldatum omdat deze gegevens belangrijk bewijs kunnen vormen.</p>"}, {"title": "10. Uw rechten (AVG/GDPR)", "body": "<p>Als u zich in de EER bevindt, heeft u volgens de toepasselijke wet rechten op onder meer inzage, rectificatie, verwijdering, beperking, gegevensoverdraagbaarheid en bezwaar. Neem contact op via support@silenthalos.com.</p>"}, {"title": "11. Kinderen en leeftijd", "body": "<p>SilentHalos is niet gericht op kinderen jonger dan 16 jaar. Wij verzamelen niet bewust persoonsgegevens van personen onder 16 zonder verifieerbare ouderlijke toestemming.</p>"}, {"title": "12. Internationale gegevensverwerking", "body": "<p>SilentHalos wordt vanuit Nederland ontwikkeld en geëxploiteerd. Firebase kan verwerking buiten de EER omvatten. Google gebruikt standaardcontractbepalingen en andere waarborgen voor internationale doorgifte volgens de AVG.</p>"}, {"title": "13. Wijzigingen in dit privacybeleid", "body": "<p>Wij kunnen dit beleid bijwerken. Bij materiële wijzigingen passen wij de datum bovenaan aan. Voortgezet gebruik nadat wijzigingen zijn gepubliceerd geldt als aanvaarding van de bijgewerkte versie.</p>"}, {"title": "14. Contact", "body": "<p>SilentHalos wordt geëxploiteerd door Fenikia International, een in Nederland geregistreerde eenmanszaak. Website: silenthalos.com. E-mail: support@silenthalos.com.</p>"}]}, "de": {"dir": "ltr", "legal": "Rechtliches", "title": "Datenschutzerklärung", "home": "Startseite", "meta": "Zuletzt aktualisiert: August 2026 · Gilt für die SilentHalos-App und zugehörige Webdienste.", "note": "Die englische Version ist rechtlich maßgeblich. Andere Sprachen sind Übersetzungen zur Orientierung.", "rights": "© 2026 SilentHalos. Alle Rechte vorbehalten.", "privacy": "Datenschutzerklärung", "terms": "Nutzungsbedingungen", "sections": [{"title": "1. Informationen, die wir erheben", "body": "<p>SilentHalos verarbeitet nur Daten, die für Sicherheits- und Notfallfunktionen erforderlich sind. Dazu können Profil- und Geräteinformationen, GPS- und Standortdaten, Vorfalldaten, Batterie/Netz/GPS-Telemetrie, Audioaufnahmen, Kamerafotos, Notfallkontakte und technische Servicedaten gehören. Ein optionales Profilfoto bleibt lokal auf Ihrem Gerät.</p>"}, {"title": "2. Verwendung der Informationen", "body": "<p>Wir verwenden diese Daten ausschließlich für SOS- und Sicherheitsfunktionen, Warnungen an Vertrauenspersonen, sichere Vorfalldatensätze, die Anzeige verfügbarer Standort/Audio/Foto-Daten, Einstellungen und technische Zuverlässigkeit. Keine Werbung oder Profilbildung.</p>"}, {"title": "3. Verarbeitung von Notfalldaten", "body": "<p>Standort, Audio und Fotos werden nur verarbeitet, wenn der Schutz aktiv ist oder ein SOS ausgelöst wird. Sie können zu Firebase hochgeladen werden, um einen sicheren Echtzeit-Vorfallsdatensatz zu erstellen und Vertrauenspersonen bei der Ortung und Unterstützung zu helfen.</p>"}, {"title": "4. Standortdaten", "body": "<p>GPS- und Netzwerkstandort dienen Live-Notfallstandort, Standortverlauf und Genauigkeitsinformationen. Standortdaten werden weder für Werbung verwendet noch verkauft.</p>"}, {"title": "5. Kamera und Mikrofon", "body": "<p>Das Mikrofon wird nur für Audio während eines aktiven SOS verwendet. Die Kamera nur für Front- und Rückbilder während eines SOS, soweit technisch möglich und erlaubt. Keine Nutzung für Werbung oder Marketinganalysen.</p>"}, {"title": "6. Notfallkontakte", "body": "<p>Sie können bis zu drei Vertrauenspersonen hinzufügen. Namen und Telefonnummern werden lokal gespeichert und nur für Notfallbenachrichtigungen/SMS verwendet.</p>"}, {"title": "7. Firebase und Dienstleister", "body": "<p>SilentHalos nutzt Google Firebase: Firestore für Vorfalldaten, Storage für Audio und Fotos und Hosting für Website und Vorfallsseiten. Firebase-Daten unterliegen auch den Datenschutz- und Sicherheitspraktiken von Google. Eine Weitergabe erfolgt nur, soweit gesetzlich erforderlich.</p>"}, {"title": "8. Datenspeicherung und Sicherheit", "body": "<p>Vorfalldaten werden auf Google-Firebase-Infrastruktur gespeichert. Wir setzen angemessene technische Schutzmaßnahmen ein. Vorfallsseiten verwenden eine eindeutige ID und sind für Vertrauenspersonen vorgesehen. Profilpräferenzen und Notfallkontakte bleiben lokal auf Ihrem Gerät.</p>"}, {"title": "9. Aufbewahrung", "body": "<p>Vorfalldaten einschließlich Standort, Audio und Fotos bleiben gespeichert, bis Sie oder eine berechtigte Person die Löschung verlangen. Derzeit gibt es keine automatische Löschung, da die Daten wichtige Beweise darstellen können.</p>"}, {"title": "10. Ihre Rechte (DSGVO)", "body": "<p>Im EWR haben Sie nach geltendem Recht insbesondere Rechte auf Auskunft, Berichtigung, Löschung, Einschränkung, Datenübertragbarkeit und Widerspruch. Kontakt: support@silenthalos.com.</p>"}, {"title": "11. Kinder und Altersanforderungen", "body": "<p>SilentHalos richtet sich nicht an Kinder unter 16 Jahren. Wir erheben wissentlich keine personenbezogenen Daten von Personen unter 16 ohne überprüfbare elterliche Einwilligung.</p>"}, {"title": "12. Internationale Datenverarbeitung", "body": "<p>SilentHalos wird in den Niederlanden entwickelt und betrieben. Firebase kann Verarbeitung außerhalb des EWR umfassen. Google verwendet Standardvertragsklauseln und andere DSGVO-konforme Schutzmechanismen.</p>"}, {"title": "13. Änderungen dieser Datenschutzerklärung", "body": "<p>Wir können diese Erklärung aktualisieren. Bei wesentlichen Änderungen wird das Datum oben angepasst. Die weitere Nutzung nach Veröffentlichung gilt als Zustimmung zur aktualisierten Fassung.</p>"}, {"title": "14. Kontakt", "body": "<p>SilentHalos wird von Fenikia International, einem in den Niederlanden registrierten Einzelunternehmen, betrieben. Website: silenthalos.com. E-Mail: support@silenthalos.com.</p>"}]}, "fr": {"dir": "ltr", "legal": "Mentions légales", "title": "Politique de confidentialité", "home": "Accueil", "meta": "Dernière mise à jour : août 2026 · S’applique à l’application SilentHalos et aux services web associés.", "note": "La version anglaise est juridiquement déterminante. Les autres langues sont des traductions de commodité.", "rights": "© 2026 SilentHalos. Tous droits réservés.", "privacy": "Politique de confidentialité", "terms": "Conditions générales", "sections": [{"title": "1. Informations collectées", "body": "<p>SilentHalos traite uniquement les données nécessaires aux fonctions de sécurité et d’urgence. Cela peut inclure profil et appareil, GPS et localisation, données d’incident, télémétrie batterie/réseau/GPS, audio, photos, contacts d’urgence et données techniques. Une photo de profil facultative reste locale sur votre appareil.</p>"}, {"title": "2. Utilisation des informations", "body": "<p>Nous utilisons ces données uniquement pour les fonctions SOS/sécurité, les alertes aux contacts de confiance, la création de dossiers d’incident sécurisés, l’affichage des données disponibles de localisation/audio/photo, les réglages et la fiabilité technique. Aucune publicité ni profilage.</p>"}, {"title": "3. Traitement des données d’urgence", "body": "<p>La localisation, l’audio et les photos ne sont traités que lorsque la protection est active ou qu’un SOS est déclenché. Ils peuvent être envoyés à Firebase pour créer un dossier sécurisé en temps réel et aider vos contacts de confiance à vous localiser et vous assister.</p>"}, {"title": "4. Données de localisation", "body": "<p>Le GPS et la localisation réseau servent au partage de position d’urgence en direct, au trajet et à la précision. Ces données ne sont ni utilisées pour la publicité ni vendues.</p>"}, {"title": "5. Caméra et microphone", "body": "<p>Le microphone sert uniquement à l’audio pendant un SOS actif. La caméra sert uniquement aux photos avant/arrière pendant un SOS, lorsque cela est techniquement possible et autorisé. Aucun usage publicitaire ou marketing.</p>"}, {"title": "6. Contacts d’urgence", "body": "<p>Vous pouvez ajouter jusqu’à trois contacts de confiance. Leurs noms et numéros sont stockés localement et utilisés uniquement pour envoyer des notifications/SMS d’urgence.</p>"}, {"title": "7. Firebase et prestataires", "body": "<p>SilentHalos utilise Google Firebase : Firestore pour les données d’incident, Storage pour l’audio et les photos, Hosting pour le site et les pages d’incident. Les données Firebase sont également soumises aux pratiques de confidentialité et de sécurité de Google. Aucun partage sauf obligation légale.</p>"}, {"title": "8. Stockage et sécurité", "body": "<p>Les données d’incident sont stockées sur l’infrastructure Google Firebase. Nous appliquons des mesures techniques raisonnables. Les pages d’incident utilisent un identifiant unique et sont destinées aux contacts de confiance. Les préférences et contacts restent locaux sur votre appareil.</p>"}, {"title": "9. Conservation des données", "body": "<p>Les données d’incident, y compris localisation, audio et photos, sont conservées jusqu’à ce que vous ou une personne autorisée demandiez leur suppression. Il n’y a actuellement pas d’expiration automatique car elles peuvent constituer des preuves importantes.</p>"}, {"title": "10. Vos droits (RGPD)", "body": "<p>Dans l’EEE, vous disposez notamment de droits d’accès, rectification, effacement, limitation, portabilité et opposition selon la loi applicable. Contact : support@silenthalos.com.</p>"}, {"title": "11. Enfants et âge minimum", "body": "<p>SilentHalos ne s’adresse pas aux enfants de moins de 16 ans et ne collecte pas sciemment leurs données sans consentement parental vérifiable.</p>"}, {"title": "12. Traitement international", "body": "<p>SilentHalos est développé et exploité depuis les Pays-Bas. Firebase peut impliquer un traitement hors EEE. Google utilise des clauses contractuelles types et d’autres garanties conformes au RGPD.</p>"}, {"title": "13. Modifications de cette politique", "body": "<p>Nous pouvons mettre cette politique à jour. En cas de modification importante, la date en haut sera actualisée. La poursuite de l’utilisation après publication vaut acceptation de la version mise à jour.</p>"}, {"title": "14. Contact", "body": "<p>SilentHalos est exploité par Fenikia International, entreprise individuelle enregistrée aux Pays-Bas. Site : silenthalos.com. E-mail : support@silenthalos.com.</p>"}]}, "es": {"dir": "ltr", "legal": "Legal", "title": "Política de privacidad", "home": "Inicio", "meta": "Última actualización: agosto de 2026 · Se aplica a la aplicación SilentHalos y a los servicios web asociados.", "note": "La versión inglesa es jurídicamente vinculante. Las demás versiones son traducciones de cortesía.", "rights": "© 2026 SilentHalos. Todos los derechos reservados.", "privacy": "Política de privacidad", "terms": "Términos y condiciones", "sections": [{"title": "1. Información que recopilamos", "body": "<p>SilentHalos procesa solo los datos necesarios para las funciones de seguridad y emergencia. Puede incluir perfil y dispositivo, GPS y ubicación, datos del incidente, telemetría de batería/red/GPS, audio, fotos, contactos de emergencia y datos técnicos. Una foto de perfil opcional permanece local en tu dispositivo.</p>"}, {"title": "2. Cómo usamos la información", "body": "<p>Usamos estos datos únicamente para funciones SOS/seguridad, alertar a contactos de confianza, crear registros seguros, mostrar datos disponibles de ubicación/audio/fotos, guardar ajustes y mejorar la fiabilidad técnica. No usamos los datos para publicidad ni perfiles.</p>"}, {"title": "3. Tratamiento de datos de emergencia", "body": "<p>La ubicación, el audio y las fotos se procesan solo cuando la protección está activa o se activa un SOS. Pueden subirse a Firebase para crear un registro seguro en tiempo real y ayudar a tus contactos de confianza a localizarte y asistirte.</p>"}, {"title": "4. Datos de ubicación", "body": "<p>El GPS y la ubicación de red se usan para ubicación de emergencia en vivo, recorrido y precisión. No se usan para publicidad ni se venden.</p>"}, {"title": "5. Cámara y micrófono", "body": "<p>El micrófono se usa solo para audio durante un SOS activo. La cámara solo para fotos frontal/trasera durante un SOS cuando sea técnicamente posible y esté permitido. Sin uso publicitario o de marketing.</p>"}, {"title": "6. Contactos de emergencia", "body": "<p>Puedes añadir hasta tres contactos de confianza. Sus nombres y teléfonos se almacenan localmente y solo se usan para notificaciones/SMS de emergencia.</p>"}, {"title": "7. Firebase y proveedores", "body": "<p>SilentHalos usa Google Firebase: Firestore para datos de incidentes, Storage para audio/fotos y Hosting para el sitio y páginas de incidentes. Los datos también están sujetos a las prácticas de privacidad y seguridad de Google. No se comparten salvo obligación legal.</p>"}, {"title": "8. Almacenamiento y seguridad", "body": "<p>Los datos de incidentes se almacenan en infraestructura de Google Firebase. Aplicamos medidas técnicas razonables. Las páginas usan un identificador único y están destinadas a contactos de confianza. Preferencias y contactos permanecen locales en el dispositivo.</p>"}, {"title": "9. Conservación", "body": "<p>Los datos del incidente, incluida ubicación, audio y fotos, se conservan hasta que tú o una parte autorizada solicite su eliminación. Actualmente no hay caducidad automática porque pueden ser evidencia importante.</p>"}, {"title": "10. Tus derechos (RGPD)", "body": "<p>En el EEE tienes, entre otros, derechos de acceso, rectificación, supresión, limitación, portabilidad y oposición conforme a la ley. Contacto: support@silenthalos.com.</p>"}, {"title": "11. Menores y edad", "body": "<p>SilentHalos no está dirigido a menores de 16 años y no recopila conscientemente sus datos sin consentimiento parental verificable.</p>"}, {"title": "12. Tratamiento internacional", "body": "<p>SilentHalos se desarrolla y opera desde los Países Bajos. Firebase puede implicar tratamiento fuera del EEE. Google utiliza cláusulas contractuales tipo y otras garantías conforme al RGPD.</p>"}, {"title": "13. Cambios en esta política", "body": "<p>Podemos actualizar esta política. Los cambios importantes actualizarán la fecha superior. El uso continuado después de la publicación implica aceptación de la versión actualizada.</p>"}, {"title": "14. Contacto", "body": "<p>SilentHalos está operado por Fenikia International, empresa individual registrada en los Países Bajos. Sitio: silenthalos.com. Correo: support@silenthalos.com.</p>"}]}, "it": {"dir": "ltr", "legal": "Note legali", "title": "Informativa sulla privacy", "home": "Home", "meta": "Ultimo aggiornamento: agosto 2026 · Si applica all’app SilentHalos e ai servizi web associati.", "note": "La versione inglese è il testo giuridicamente prevalente. Le altre lingue sono traduzioni di cortesia.", "rights": "© 2026 SilentHalos. Tutti i diritti riservati.", "privacy": "Informativa sulla privacy", "terms": "Termini e condizioni", "sections": [{"title": "1. Informazioni raccolte", "body": "<p>SilentHalos tratta solo i dati necessari alle funzioni di sicurezza ed emergenza. Possono includere profilo e dispositivo, GPS e posizione, dati dell’incidente, telemetria batteria/rete/GPS, audio, foto, contatti di emergenza e dati tecnici. Una foto profilo opzionale resta locale sul dispositivo.</p>"}, {"title": "2. Come utilizziamo le informazioni", "body": "<p>Utilizziamo questi dati esclusivamente per funzioni SOS/sicurezza, avvisare contatti fidati, creare registri sicuri, mostrare dati disponibili di posizione/audio/foto, salvare impostazioni e migliorare l’affidabilità tecnica. Nessun uso per pubblicità o profilazione.</p>"}, {"title": "3. Trattamento dei dati di emergenza", "body": "<p>Posizione, audio e foto vengono trattati solo quando la protezione è attiva o viene attivato un SOS. Possono essere caricati su Firebase per creare un registro sicuro in tempo reale e aiutare i contatti fidati a localizzarti e assisterti.</p>"}, {"title": "4. Dati di posizione", "body": "<p>GPS e posizione di rete servono alla posizione d’emergenza live, alla traccia e alla precisione. Non sono usati per pubblicità né venduti.</p>"}, {"title": "5. Fotocamera e microfono", "body": "<p>Il microfono serve solo all’audio durante un SOS attivo. La fotocamera solo alle immagini anteriori/posteriori durante un SOS quando tecnicamente possibile e autorizzato. Nessun uso pubblicitario o marketing.</p>"}, {"title": "6. Contatti di emergenza", "body": "<p>Puoi aggiungere fino a tre contatti fidati. Nomi e numeri sono memorizzati localmente e usati solo per notifiche/SMS di emergenza.</p>"}, {"title": "7. Firebase e fornitori", "body": "<p>SilentHalos usa Google Firebase: Firestore per dati incidenti, Storage per audio/foto e Hosting per sito e pagine incidente. I dati sono anche soggetti alle pratiche privacy e sicurezza di Google. Nessuna condivisione salvo obbligo di legge.</p>"}, {"title": "8. Archiviazione e sicurezza", "body": "<p>I dati incidente sono conservati sull’infrastruttura Google Firebase. Adottiamo misure tecniche ragionevoli. Le pagine usano un identificatore unico e sono destinate ai contatti fidati. Preferenze e contatti restano locali sul dispositivo.</p>"}, {"title": "9. Conservazione", "body": "<p>I dati incidente, inclusi posizione, audio e foto, restano conservati finché tu o una parte autorizzata non ne richiedete la cancellazione. Attualmente non c’è scadenza automatica perché possono essere prove importanti.</p>"}, {"title": "10. I tuoi diritti (GDPR)", "body": "<p>Nello SEE hai, tra gli altri, diritti di accesso, rettifica, cancellazione, limitazione, portabilità e opposizione secondo la legge. Contatto: support@silenthalos.com.</p>"}, {"title": "11. Minori e requisiti di età", "body": "<p>SilentHalos non è rivolto a minori di 16 anni e non raccoglie consapevolmente i loro dati senza consenso verificabile dei genitori.</p>"}, {"title": "12. Trattamento internazionale", "body": "<p>SilentHalos è sviluppato e gestito dai Paesi Bassi. Firebase può comportare trattamenti fuori dallo SEE. Google utilizza clausole contrattuali standard e altre garanzie GDPR.</p>"}, {"title": "13. Modifiche alla presente informativa", "body": "<p>Possiamo aggiornare questa informativa. In caso di modifiche sostanziali aggiorneremo la data in alto. L’uso continuato dopo la pubblicazione vale come accettazione.</p>"}, {"title": "14. Contatti", "body": "<p>SilentHalos è gestito da Fenikia International, impresa individuale registrata nei Paesi Bassi. Sito: silenthalos.com. E-mail: support@silenthalos.com.</p>"}]}, "ru": {"dir": "ltr", "legal": "Правовая информация", "title": "Политика конфиденциальности", "home": "Главная", "meta": "Последнее обновление: август 2026 · Применяется к приложению SilentHalos и связанным веб-сервисам.", "note": "Английская версия является юридически определяющей. Другие языки предоставлены как переводы для удобства.", "rights": "© 2026 SilentHalos. Все права защищены.", "privacy": "Политика конфиденциальности", "terms": "Условия использования", "sections": [{"title": "1. Какие данные мы собираем", "body": "<p>SilentHalos обрабатывает только данные, необходимые для функций безопасности и экстренной помощи. Это могут быть профиль и устройство, GPS и местоположение, данные инцидента, телеметрия батареи/сети/GPS, аудио, фото, экстренные контакты и технические данные. Необязательная фотография профиля остаётся локально на устройстве.</p>"}, {"title": "2. Как мы используем данные", "body": "<p>Мы используем эти данные только для функций SOS/безопасности, уведомлений доверенным контактам, создания защищённых записей, отображения доступных данных местоположения/аудио/фото, сохранения настроек и повышения технической надёжности. Без рекламы и профилирования.</p>"}, {"title": "3. Обработка экстренных данных", "body": "<p>Местоположение, аудио и фотографии обрабатываются только при активной защите или запуске SOS. Они могут загружаться в Firebase для создания защищённой записи в реальном времени и помощи доверенным контактам в вашем поиске и поддержке.</p>"}, {"title": "4. Данные местоположения", "body": "<p>GPS и сетевое местоположение используются для экстренного местоположения в реальном времени, маршрута и точности. Данные не продаются и не используются для рекламы.</p>"}, {"title": "5. Камера и микрофон", "body": "<p>Микрофон используется только для аудио во время активного SOS. Камера — только для передних/задних фото во время SOS, если технически возможно и разрешено. Без рекламного или маркетингового использования.</p>"}, {"title": "6. Экстренные контакты", "body": "<p>Можно добавить до трёх доверенных контактов. Их имена и телефоны хранятся локально и используются только для экстренных уведомлений/SMS.</p>"}, {"title": "7. Firebase и поставщики услуг", "body": "<p>SilentHalos использует Google Firebase: Firestore для данных инцидентов, Storage для аудио/фото и Hosting для сайта и страниц инцидентов. Также применяются правила конфиденциальности и безопасности Google. Передача — только если требует закон.</p>"}, {"title": "8. Хранение и безопасность", "body": "<p>Данные инцидентов хранятся в инфраструктуре Google Firebase. Мы применяем разумные технические меры. Страницы используют уникальный идентификатор и предназначены для доверенных контактов. Настройки и контакты остаются локально на устройстве.</p>"}, {"title": "9. Срок хранения", "body": "<p>Данные инцидентов, включая местоположение, аудио и фото, хранятся до запроса на удаление от вас или уполномоченной стороны. Автоматического удаления пока нет, поскольку данные могут быть важными доказательствами.</p>"}, {"title": "10. Ваши права (GDPR)", "body": "<p>В ЕЭЗ вы имеете права на доступ, исправление, удаление, ограничение, переносимость и возражение в пределах закона. Контакт: support@silenthalos.com.</p>"}, {"title": "11. Дети и возраст", "body": "<p>SilentHalos не предназначен для лиц младше 16 лет. Мы сознательно не собираем их данные без проверяемого согласия родителей.</p>"}, {"title": "12. Международная обработка", "body": "<p>SilentHalos разрабатывается и управляется из Нидерландов. Firebase может обрабатывать данные вне ЕЭЗ. Google использует стандартные договорные положения и иные гарантии GDPR.</p>"}, {"title": "13. Изменения политики", "body": "<p>Мы можем обновлять политику. При существенных изменениях дата наверху будет обновлена. Продолжение использования после публикации означает принятие обновлённой версии.</p>"}, {"title": "14. Контакты", "body": "<p>SilentHalos управляется Fenikia International, индивидуальным предприятием, зарегистрированным в Нидерландах. Сайт: silenthalos.com. Email: support@silenthalos.com.</p>"}]}, "tr": {"dir": "ltr", "legal": "Yasal", "title": "Gizlilik Politikası", "home": "Ana Sayfa", "meta": "Son güncelleme: Ağustos 2026 · SilentHalos uygulaması ve ilgili web hizmetleri için geçerlidir.", "note": "İngilizce sürüm hukuken esas metindir. Diğer diller kolaylık amacıyla sağlanan çevirilerdir.", "rights": "© 2026 SilentHalos. Tüm hakları saklıdır.", "privacy": "Gizlilik Politikası", "terms": "Şartlar ve Koşullar", "sections": [{"title": "1. Topladığımız bilgiler", "body": "<p>SilentHalos yalnızca acil durum ve güvenlik işlevleri için gerekli verileri işler. Profil/cihaz, GPS/konum, olay verileri, pil/ağ/GPS telemetrisi, ses, fotoğraf, acil durum kişileri ve teknik veriler buna dahil olabilir. İsteğe bağlı profil fotoğrafı cihazda yerel kalır.</p>"}, {"title": "2. Bilgileri nasıl kullanırız", "body": "<p>Verileri yalnızca SOS/güvenlik özellikleri, güvenilir kişilere uyarılar, güvenli olay kayıtları, mevcut konum/ses/fotoğraf bilgilerinin gösterimi, ayarlar ve teknik güvenilirlik için kullanırız. Reklam veya profilleme yoktur.</p>"}, {"title": "3. Acil durum verilerinin işlenmesi", "body": "<p>Konum, ses ve fotoğraflar yalnızca koruma aktifken veya SOS tetiklendiğinde işlenir. Güvenli gerçek zamanlı kayıt ve güvenilir kişilerin sizi bulmasına yardımcı olmak için Firebase’e yüklenebilir.</p>"}, {"title": "4. Konum verileri", "body": "<p>GPS ve ağ konumu canlı acil durum konumu, iz ve doğruluk için kullanılır. Reklam amacıyla kullanılmaz veya satılmaz.</p>"}, {"title": "5. Kamera ve mikrofon", "body": "<p>Mikrofon yalnızca aktif SOS sırasındaki ses için, kamera yalnızca teknik olarak mümkün ve izinli olduğunda SOS sırasındaki ön/arka fotoğraflar için kullanılır. Reklam veya pazarlama için kullanılmaz.</p>"}, {"title": "6. Acil durum kişileri", "body": "<p>En fazla üç güvenilir kişi ekleyebilirsiniz. İsim ve numaralar cihazda yerel saklanır ve yalnızca acil bildirim/SMS için kullanılır.</p>"}, {"title": "7. Firebase ve hizmet sağlayıcılar", "body": "<p>SilentHalos Google Firebase kullanır: olay verileri için Firestore, ses/fotoğraflar için Storage ve site/olay sayfaları için Hosting. Veriler Google’ın gizlilik ve güvenlik uygulamalarına da tabidir. Yasal zorunluluk dışında paylaşılmaz.</p>"}, {"title": "8. Veri saklama ve güvenlik", "body": "<p>Olay verileri Google Firebase altyapısında saklanır. Makul teknik önlemler uygularız. Sayfalar benzersiz kimlik kullanır ve güvenilir kişiler içindir. Tercihler ve acil kişiler cihazda yerel kalır.</p>"}, {"title": "9. Veri saklama süresi", "body": "<p>Konum, ses ve fotoğraflar dahil olay verileri siz veya yetkili taraf silme talep edene kadar saklanır. Önemli kanıt olabilecekleri için şu anda otomatik sona erme yoktur.</p>"}, {"title": "10. Haklarınız (GDPR)", "body": "<p>AEA’da erişim, düzeltme, silme, kısıtlama, taşınabilirlik ve itiraz haklarına sahipsiniz. İletişim: support@silenthalos.com.</p>"}, {"title": "11. Çocuklar ve yaş şartı", "body": "<p>SilentHalos 16 yaş altına yönelik değildir ve doğrulanabilir ebeveyn izni olmadan bu kişilerin verilerini bilerek toplamaz.</p>"}, {"title": "12. Uluslararası veri işleme", "body": "<p>SilentHalos Hollanda’dan geliştirilir ve işletilir. Firebase, AEA dışında veri işlemeyi içerebilir. Google GDPR’ye uygun standart sözleşme maddeleri ve diğer güvenceleri kullanır.</p>"}, {"title": "13. Politikadaki değişiklikler", "body": "<p>Politikayı güncelleyebiliriz. Önemli değişikliklerde üstteki tarih güncellenir. Yayın sonrası kullanıma devam etmek güncel sürümü kabul etmek anlamına gelir.</p>"}, {"title": "14. İletişim", "body": "<p>SilentHalos, Hollanda’da kayıtlı şahıs işletmesi Fenikia International tarafından işletilmektedir. Web: silenthalos.com. E-posta: support@silenthalos.com.</p>"}]}, "zh": {"dir": "ltr", "legal": "法律信息", "title": "隐私政策", "home": "首页", "meta": "最后更新：2026年8月 · 适用于 SilentHalos 应用及相关网络服务。", "note": "英文版本为具有法律效力的控制文本。其他语言仅作为便利翻译提供。", "rights": "© 2026 SilentHalos。保留所有权利。", "privacy": "隐私政策", "terms": "条款与条件", "sections": [{"title": "1. 我们收集的信息", "body": "<p>SilentHalos 仅处理提供紧急安全功能所必需的数据，包括可能的个人资料/设备信息、GPS/位置、事件数据、电量/网络/GPS 遥测、音频、照片、紧急联系人和技术数据。可选的个人资料照片保留在设备本地。</p>"}, {"title": "2. 我们如何使用信息", "body": "<p>数据仅用于 SOS/安全功能、向可信联系人发送警报、创建安全事件记录、展示可用的位置/音频/照片信息、保存设置及提高技术可靠性。不会用于广告或用户画像。</p>"}, {"title": "3. 紧急数据处理", "body": "<p>位置、音频和照片仅在保护开启或 SOS 被触发时处理，并可能上传至 Firebase，以建立安全的实时事件记录并帮助可信联系人定位和协助您。</p>"}, {"title": "4. 位置数据", "body": "<p>GPS 和网络位置用于实时紧急位置、轨迹和精度信息。位置数据不会用于广告，也不会出售。</p>"}, {"title": "5. 摄像头与麦克风", "body": "<p>麦克风仅用于活动 SOS 期间的音频；摄像头仅在技术允许且获得权限时用于 SOS 期间的前/后摄像头照片。不会用于广告或营销分析。</p>"}, {"title": "6. 紧急联系人", "body": "<p>您最多可添加三位可信联系人。姓名和电话号码保存在设备本地，仅用于紧急通知/SMS。</p>"}, {"title": "7. Firebase 与服务提供商", "body": "<p>SilentHalos 使用 Google Firebase：Firestore 存储事件数据，Storage 存储音频/照片，Hosting 提供网站和事件页面。数据同时受 Google 隐私和安全实践约束。除法律要求外不向其他第三方共享。</p>"}, {"title": "8. 数据存储与安全", "body": "<p>事件数据存储在 Google Firebase 基础设施中。我们采取合理技术措施。事件页面使用唯一标识并面向可信联系人。偏好和联系人保留在设备本地。</p>"}, {"title": "9. 数据保留", "body": "<p>包括位置、音频和照片在内的事件记录保留至您或获授权方请求删除。目前不会自动到期，因为这些数据可能构成重要证据。</p>"}, {"title": "10. 您的权利（GDPR）", "body": "<p>在欧洲经济区，依法享有访问、更正、删除、限制处理、数据可携带和反对等权利。联系：support@silenthalos.com。</p>"}, {"title": "11. 儿童与年龄要求", "body": "<p>SilentHalos 不面向 16 岁以下儿童。未经可验证的家长同意，我们不会故意收集其个人数据。</p>"}, {"title": "12. 国际数据处理", "body": "<p>SilentHalos 在荷兰开发和运营。Firebase 可能涉及欧洲经济区以外的数据处理。Google 使用标准合同条款及其他符合 GDPR 的保障措施。</p>"}, {"title": "13. 隐私政策变更", "body": "<p>我们可能更新本政策。重大变更时会更新页面顶部日期。变更发布后继续使用即表示接受更新版本。</p>"}, {"title": "14. 联系方式", "body": "<p>SilentHalos 由在荷兰注册的个人独资企业 Fenikia International 运营。网站：silenthalos.com。邮箱：support@silenthalos.com。</p>"}]}, "ur": {"dir": "rtl", "legal": "قانونی", "title": "رازداری کی پالیسی", "home": "مرکزی صفحہ", "meta": "آخری تازہ کاری: اگست 2026 · SilentHalos ایپ اور متعلقہ ویب خدمات پر لاگو ہوتا ہے۔", "note": "انگریزی ورژن قانونی طور پر بنیادی متن ہے۔ دیگر زبانیں سہولت کے لیے ترجمے ہیں۔", "rights": "© 2026 SilentHalos۔ جملہ حقوق محفوظ ہیں۔", "privacy": "رازداری کی پالیسی", "terms": "شرائط و ضوابط", "sections": [{"title": "1. ہم کون سی معلومات جمع کرتے ہیں", "body": "<p>SilentHalos صرف ہنگامی حفاظت کے لیے ضروری ڈیٹا پراسیس کرتا ہے، جن میں پروفائل/ڈیوائس، GPS/مقام، واقعہ ڈیٹا، بیٹری/نیٹ ورک/GPS ٹیلی میٹری، آڈیو، تصاویر، ہنگامی رابطے اور تکنیکی ڈیٹا شامل ہو سکتے ہیں۔ اختیاری پروفائل تصویر ڈیوائس پر مقامی رہتی ہے۔</p>"}, {"title": "2. معلومات کا استعمال", "body": "<p>ڈیٹا صرف SOS/حفاظتی خصوصیات، قابلِ اعتماد رابطوں کو الرٹس، محفوظ واقعہ ریکارڈ، دستیاب مقام/آڈیو/تصاویر دکھانے، سیٹنگز اور تکنیکی قابلِ اعتمادیت کے لیے استعمال ہوتا ہے۔ اشتہارات یا پروفائلنگ کے لیے نہیں۔</p>"}, {"title": "3. ہنگامی ڈیٹا کی پراسیسنگ", "body": "<p>مقام، آڈیو اور تصاویر صرف اس وقت پراسیس ہوتی ہیں جب تحفظ فعال ہو یا SOS ٹرگر ہو۔ محفوظ حقیقی وقت کے ریکارڈ اور قابلِ اعتماد رابطوں کی مدد کے لیے Firebase پر اپ لوڈ ہو سکتی ہیں۔</p>"}, {"title": "4. مقام کا ڈیٹا", "body": "<p>GPS اور نیٹ ورک مقام براہِ راست ہنگامی مقام، ٹریل اور درستگی کے لیے استعمال ہوتے ہیں۔ اشتہارات کے لیے استعمال یا فروخت نہیں کیے جاتے۔</p>"}, {"title": "5. کیمرہ اور مائیکروفون", "body": "<p>مائیکروفون صرف فعال SOS کے دوران آڈیو اور کیمرہ صرف تکنیکی طور پر ممکن اور اجازت کی صورت میں SOS کے دوران سامنے/پیچھے کی تصاویر کے لیے استعمال ہوتا ہے۔ اشتہارات یا مارکیٹنگ کے لیے نہیں۔</p>"}, {"title": "6. ہنگامی رابطے", "body": "<p>آپ زیادہ سے زیادہ تین قابلِ اعتماد رابطے شامل کر سکتے ہیں۔ نام اور فون نمبر ڈیوائس پر مقامی طور پر محفوظ ہوتے ہیں اور صرف ہنگامی اطلاع/SMS کے لیے استعمال ہوتے ہیں۔</p>"}, {"title": "7. Firebase اور سروس فراہم کنندگان", "body": "<p>SilentHalos Google Firebase استعمال کرتا ہے: واقعات کے لیے Firestore، آڈیو/تصاویر کے لیے Storage، اور ویب سائٹ/واقعہ صفحات کے لیے Hosting۔ ڈیٹا Google کی رازداری اور سیکیورٹی طریقوں کے تابع بھی ہے۔ قانونی تقاضے کے علاوہ شیئر نہیں کیا جاتا۔</p>"}, {"title": "8. ڈیٹا اسٹوریج اور سیکیورٹی", "body": "<p>واقعہ ڈیٹا Google Firebase انفراسٹرکچر پر محفوظ ہوتا ہے۔ ہم مناسب تکنیکی اقدامات کرتے ہیں۔ صفحات منفرد شناخت استعمال کرتے ہیں اور قابلِ اعتماد رابطوں کے لیے ہیں۔ ترجیحات اور رابطے ڈیوائس پر مقامی رہتے ہیں۔</p>"}, {"title": "9. ڈیٹا برقرار رکھنا", "body": "<p>مقام، آڈیو اور تصاویر سمیت ریکارڈ اس وقت تک محفوظ رہتے ہیں جب تک آپ یا مجاز فریق حذف کرنے کی درخواست نہ کرے۔ فی الحال خودکار میعاد ختم نہیں ہوتی کیونکہ یہ اہم شواہد ہو سکتے ہیں۔</p>"}, {"title": "10. آپ کے حقوق (GDPR)", "body": "<p>EEA میں آپ کو قانون کے مطابق رسائی، درستگی، حذف، پابندی، ڈیٹا پورٹیبلٹی اور اعتراض کے حقوق حاصل ہیں۔ رابطہ: support@silenthalos.com۔</p>"}, {"title": "11. بچے اور عمر", "body": "<p>SilentHalos سولہ سال سے کم عمر بچوں کے لیے نہیں ہے اور قابلِ تصدیق والدین کی رضامندی کے بغیر جان بوجھ کر ان کا ذاتی ڈیٹا جمع نہیں کرتا۔</p>"}, {"title": "12. بین الاقوامی ڈیٹا پراسیسنگ", "body": "<p>SilentHalos نیدرلینڈز سے تیار اور چلایا جاتا ہے۔ Firebase میں EEA سے باہر پراسیسنگ شامل ہو سکتی ہے۔ Google GDPR کے مطابق معیاری معاہداتی شقیں اور دیگر حفاظتی اقدامات استعمال کرتا ہے۔</p>"}, {"title": "13. پالیسی میں تبدیلیاں", "body": "<p>ہم پالیسی اپ ڈیٹ کر سکتے ہیں۔ اہم تبدیلی پر اوپر کی تاریخ اپ ڈیٹ ہوگی۔ تبدیلی شائع ہونے کے بعد مسلسل استعمال اپ ڈیٹ شدہ ورژن کی قبولیت ہے۔</p>"}, {"title": "14. رابطہ", "body": "<p>SilentHalos کو Fenikia International چلاتا ہے، جو نیدرلینڈز میں رجسٹرڈ واحد ملکیتی کاروبار ہے۔ ویب سائٹ: silenthalos.com۔ ای میل: support@silenthalos.com۔</p>"}]}, "ar": {"dir": "rtl", "legal": "قانوني", "title": "سياسة الخصوصية", "home": "الرئيسية", "meta": "آخر تحديث: أغسطس 2026 · تنطبق على تطبيق SilentHalos وخدمات الويب المرتبطة به。", "note": "النسخة الإنجليزية هي النص القانوني الحاكم. وتُقدَّم اللغات الأخرى كترجمات للتسهيل.", "rights": "© 2026 SilentHalos. جميع الحقوق محفوظة.", "privacy": "سياسة الخصوصية", "terms": "الشروط والأحكام", "sections": [{"title": "1. المعلومات التي نجمعها", "body": "<p>يعالج SilentHalos فقط البيانات اللازمة لوظائف السلامة والطوارئ، وقد تشمل معلومات الملف الشخصي والجهاز، وGPS والموقع، وبيانات الحادث، وبيانات البطارية/الشبكة/GPS، والتسجيلات الصوتية، والصور، وجهات اتصال الطوارئ، والبيانات التقنية. تبقى صورة الملف الشخصي الاختيارية محلياً على جهازك.</p>"}, {"title": "2. كيفية استخدام المعلومات", "body": "<p>نستخدم البيانات حصراً لوظائف SOS والسلامة، وتنبيه جهات الاتصال الموثوقة، وإنشاء سجلات حوادث آمنة، وعرض بيانات الموقع/الصوت/الصور المتاحة، وحفظ الإعدادات، وتحسين الاعتمادية التقنية. ولا نستخدمها للإعلانات أو التنميط.</p>"}, {"title": "3. معالجة بيانات الطوارئ", "body": "<p>تتم معالجة الموقع والصوت والصور فقط عندما تكون الحماية فعالة أو عند تشغيل SOS. وقد تُرفع إلى Firebase لإنشاء سجل آمن في الوقت الفعلي ومساعدة جهات الاتصال الموثوقة على تحديد موقعك ومساعدتك.</p>"}, {"title": "4. بيانات الموقع", "body": "<p>يُستخدم GPS وموقع الشبكة لموقع الطوارئ المباشر ومسار الموقع ومعلومات الدقة. ولا تُستخدم بيانات الموقع للإعلانات ولا يتم بيعها.</p>"}, {"title": "5. الكاميرا والميكروفون", "body": "<p>يُستخدم الميكروفون فقط للصوت أثناء SOS نشط. وتُستخدم الكاميرا فقط للصور الأمامية/الخلفية أثناء SOS عندما يكون ذلك ممكناً تقنياً ومسموحاً. ولا تُستخدم هذه الصلاحيات للإعلانات أو التسويق.</p>"}, {"title": "6. جهات اتصال الطوارئ", "body": "<p>يمكنك إضافة ما يصل إلى ثلاث جهات اتصال موثوقة. تُحفظ الأسماء وأرقام الهواتف محلياً على الجهاز وتُستخدم فقط لإشعارات/رسائل SMS للطوارئ.</p>"}, {"title": "7. Firebase ومقدمو الخدمات", "body": "<p>يستخدم SilentHalos خدمات Google Firebase: ‏Firestore لبيانات الحوادث، وStorage للصوت/الصور، وHosting للموقع وصفحات الحوادث. وتخضع البيانات أيضاً لممارسات الخصوصية والأمان لدى Google. ولا تتم مشاركتها إلا إذا فرض القانون ذلك.</p>"}, {"title": "8. تخزين البيانات وأمانها", "body": "<p>تُخزن بيانات الحوادث على بنية Google Firebase. نتخذ تدابير تقنية معقولة. تستخدم صفحات الحوادث معرّفاً فريداً وهي مخصصة لجهات الاتصال الموثوقة. وتبقى التفضيلات وجهات الاتصال محلياً على جهازك.</p>"}, {"title": "9. الاحتفاظ بالبيانات", "body": "<p>تبقى سجلات الحوادث، بما فيها الموقع والصوت والصور، محفوظة حتى تطلب أنت أو جهة مخولة حذفها. ولا نطبق حالياً انتهاءً تلقائياً لأنها قد تشكل أدلة مهمة.</p>"}, {"title": "10. حقوقك وفق GDPR", "body": "<p>إذا كنت في المنطقة الاقتصادية الأوروبية فلديك وفق القانون حقوق تشمل الوصول والتصحيح والحذف وتقييد المعالجة ونقل البيانات والاعتراض. للتواصل: support@silenthalos.com.</p>"}, {"title": "11. الأطفال ومتطلبات العمر", "body": "<p>SilentHalos غير موجه للأطفال دون 16 عاماً، ولا نجمع عن علم بيانات شخصية لمن هم دون 16 عاماً دون موافقة أبوية قابلة للتحقق.</p>"}, {"title": "12. معالجة البيانات دولياً", "body": "<p>يتم تطوير SilentHalos وتشغيله من هولندا. وقد تتضمن Firebase معالجة خارج المنطقة الاقتصادية الأوروبية. تستخدم Google البنود التعاقدية القياسية وضمانات أخرى وفق متطلبات GDPR.</p>"}, {"title": "13. تغييرات سياسة الخصوصية", "body": "<p>قد نحدّث هذه السياسة. وعند إجراء تغييرات جوهرية سنحدّث التاريخ أعلى الصفحة. ويُعد استمرار الاستخدام بعد نشر التغييرات قبولاً للنسخة المحدّثة.</p>"}, {"title": "14. التواصل", "body": "<p>يتم تشغيل SilentHalos بواسطة Fenikia International، وهي منشأة فردية مسجلة في هولندا. الموقع: silenthalos.com. البريد الإلكتروني: support@silenthalos.com.</p>"}]}};const
