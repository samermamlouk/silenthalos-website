<body class="incident-body"><header class="site-header"><a class="site-brand" href="/" style="text-decoration:none;"><img src="ChatGPT Image Jun 6, 2026, 03_10_08 PM.png" alt="SilentHalos logo" class="brand-logo"><span>SilentHalos</span></a><a href="/" class="about-link" id="topHome">← Home</a></header><main class="legal-shell"><div class="legal-toolbar"><div><p class="legal-eyebrow" id="lbl">Legal</p><h1 class="legal-title" id="ttl">Terms & Conditions</h1></div><select id="lang" class="legal-language"><option value="en">EN · English</option><option value="nl">NL · Nederlands</option><option value="de">DE · Deutsch</option><option value="fr">FR · Français</option><option value="es">ES · Español</option><option value="it">IT · Italiano</option><option value="ru">RU · Русский</option><option value="tr">TR · Türkçe</option><option value="zh">ZH · 中文</option><option value="ur">UR · اردو</option><option value="ar">AR · العربية</option></select></div><p class="legal-meta" id="meta"></p><div id="sections"></div><p class="legal-note" id="note"></p><footer class="legal-footer"><span id="rights"></span><div class="legal-footer-links"><a href="/privacy" id="pl"></a><a href="/terms" id="tl"></a><a href="/" id="bh"></a></div></footer></main>
<script>const D={"en": {"dir": "ltr", "legal": "Legal", "title": "Terms & Conditions", "home": "Home", "meta": "Last updated: August 2026 · Please read these terms carefully before using SilentHalos.", "note": "The English version is the controlling legal text. Other languages are convenience translations.", "rights": "© 2026 SilentHalos. All rights reserved.", "privacy": "Privacy Policy", "terms": "Terms & Conditions", "sections": [{"title": "1. Acceptance of Terms", "body": "<p>By downloading, installing, or using the SilentHalos mobile application or any associated web services (collectively, the \"Service\"), you agree to be bound by these Terms &amp; Conditions. If you do not agree to these terms, do not use the Service.</p><p>These Terms form a legally binding agreement between you and <strong>Fenikia International</strong>, a sole proprietorship registered in the Netherlands (\"SilentHalos\", \"we\", \"us\", or \"our\").</p>"}, {"title": "2. Description of the Service", "body": "<p>SilentHalos is a personal safety application designed to assist users in emergency situations. When activated, the application may:</p><ul><li>Send an emergency SMS alert to your designated trusted contacts.</li><li>Share your real-time GPS location via a secure incident web page.</li><li>Record audio evidence using your device microphone during an SOS event.</li><li>Capture photos using your device camera during an SOS event.</li><li>Upload emergency evidence to secure cloud storage accessible to your trusted contacts.</li></ul><p>The Service is intended as a personal safety tool to supplement — not replace — official emergency services.</p>"}, {"title": "3. Emergency Service Disclaimer", "body": "<p><strong>SilentHalos is not a substitute for official emergency services.</strong> The application does not contact police, ambulance, fire brigade, or any other professional emergency service on your behalf.</p><p>In any life-threatening emergency, you must contact the relevant official emergency services directly (for example, 112 in the European Union). SilentHalos is a supplementary personal safety tool only.</p><p>We do not guarantee that the application will function correctly in all circumstances. Mobile network availability, GPS signal, battery status, device permissions, operating system restrictions, and internet connectivity can all affect the ability of SilentHalos to deliver its functionality.</p>"}, {"title": "4. User Responsibilities", "body": "<p>By using SilentHalos, you agree to:</p><ul><li>Use the Service only for lawful personal safety purposes.</li><li>Provide accurate information, including correct emergency contact details.</li><li>Inform your emergency contacts that they may receive SilentHalos alerts.</li><li>Keep the application and your device updated to maintain proper functionality.</li><li>Not use the Service to harass, deceive, or harm any individual.</li><li>Not trigger false SOS events intentionally.</li><li>Maintain the security of your account and device.</li></ul>"}, {"title": "5. Permissions and Device Requirements", "body": "<p>SilentHalos requires the following device permissions to function:</p><ul><li><strong>Location (GPS)</strong> — for real-time emergency location sharing.</li><li><strong>Microphone</strong> — for audio evidence capture during an SOS event.</li><li><strong>Camera</strong> — for photo evidence capture during an SOS event.</li><li><strong>Contacts / SMS</strong> — to send emergency notifications to your trusted contacts.</li></ul><p>If required permissions are denied, certain emergency features may not function. You are responsible for granting and maintaining the necessary permissions on your device.</p>"}, {"title": "6. GPS, Network, and Device Limitations", "body": "<p>The accuracy and availability of SilentHalos functionality depends on factors outside our control, including:</p><ul><li>GPS signal strength and availability in your location.</li><li>Mobile network and internet connectivity.</li><li>Device battery level and power management settings.</li><li>Operating system restrictions and background process limitations (particularly on Android).</li><li>Third-party service availability (including Firebase and Google Maps).</li></ul><p>We do not warrant that location data will be accurate, that alerts will be delivered instantly, or that the Service will be available without interruption.</p>"}, {"title": "7. Accuracy and Availability", "body": "<p>We strive to provide a reliable service but cannot guarantee uninterrupted availability. The Service may be temporarily unavailable due to maintenance, technical failures, or circumstances beyond our control. We are not liable for any loss or harm resulting from unavailability or inaccuracy of the Service.</p>"}, {"title": "8. Emergency Contacts", "body": "<p>You are responsible for ensuring that the emergency contacts you add to SilentHalos are willing and able to receive emergency alerts. We are not responsible if your contacts are unreachable, unable to respond, or if SMS delivery fails due to network issues or incorrect contact details.</p>"}, {"title": "9. User-Generated Emergency Evidence", "body": "<p>Audio recordings and photos captured during an SOS event are your personal emergency evidence. You are responsible for any content captured by your device through SilentHalos. Emergency evidence is stored in Firebase and accessible via a unique incident link. You should share incident links only with people you trust.</p>"}, {"title": "10. Account Security", "body": "<p>You are responsible for maintaining the security of your device and the SilentHalos application. If you believe your account or incident data has been accessed without authorisation, please contact us immediately at <a href=\"mailto:support@silenthalos.com\">support@silenthalos.com</a>.</p>"}, {"title": "11. Premium Subscription", "body": "<p>SilentHalos offers an optional premium subscription that unlocks additional features. Subscription terms, pricing, and cancellation policies are managed through the Google Play Store. Subscription fees are charged through your Google Play account and are subject to Google's billing terms. We do not offer refunds outside of those available through the Google Play Store's refund policy.</p>"}, {"title": "12. Intellectual Property", "body": "<p>All intellectual property rights in SilentHalos — including the application, its design, code, branding, and content — belong to <strong>Fenikia International</strong>. You are granted a limited, non-exclusive, non-transferable licence to use the application for personal safety purposes only. You may not copy, modify, distribute, or reverse-engineer any part of the Service.</p>"}, {"title": "13. Prohibited Use", "body": "<p>You may not use SilentHalos to:</p><ul><li>Trigger false or misleading emergency alerts.</li><li>Violate any applicable law or regulation.</li><li>Infringe the privacy or rights of others.</li><li>Attempt to gain unauthorised access to our systems or data.</li><li>Use the Service in a way that disrupts, damages, or overburdens its infrastructure.</li><li>Resell, sublicense, or commercially exploit the Service without authorisation.</li></ul>"}, {"title": "14. Limitation of Liability", "body": "<p>To the fullest extent permitted by applicable law, SilentHalos and its operators shall not be liable for any indirect, incidental, special, or consequential damages arising from your use of or inability to use the Service, including but not limited to personal injury, property damage, or failure of an emergency alert to be delivered.</p><p>Our total liability for any claim arising from use of the Service shall not exceed the amount you paid for the Service in the twelve months preceding the claim.</p>"}, {"title": "15. Suspension and Termination", "body": "<p>We reserve the right to suspend or terminate your access to the Service at any time if you breach these Terms or if we reasonably believe your use poses a risk to other users or to the integrity of the Service. You may stop using the Service at any time by uninstalling the application.</p>"}, {"title": "16. Changes to the Service", "body": "<p>We may update, modify, or discontinue features of the Service at any time. We will endeavour to provide reasonable notice of significant changes. Continued use of the Service after changes are made constitutes acceptance of those changes.</p>"}, {"title": "17. Changes to These Terms", "body": "<p>We may update these Terms &amp; Conditions from time to time. The \"Last updated\" date at the top of this page reflects the most recent revision. We will notify users of material changes through the application or website where reasonably practicable. Your continued use of the Service after the effective date of any changes constitutes your acceptance of the revised Terms.</p>"}, {"title": "18. Governing Law", "body": "<p>These Terms shall be governed by the laws of the Netherlands, without regard to its conflict of law provisions. Any disputes arising from these Terms or your use of the Service shall be subject to the jurisdiction of the competent courts in the Netherlands, unless other mandatory consumer-protection laws in your country of residence apply.</p>"}, {"title": "19. Contact", "body": "<p>If you have questions about these Terms &amp; Conditions, please contact us:</p><ul><li>Operator: Fenikia International, a sole proprietorship registered in the Netherlands.</li><li>Website: <a href=\"https://silenthalos.com\">silenthalos.com</a></li><li>Email: <a href=\"mailto:support@silenthalos.com\">support@silenthalos.com</a></li></ul>"}]}, "nl": {"dir": "ltr", "legal": "Juridisch", "title": "Algemene voorwaarden", "home": "Home", "meta": "Laatst bijgewerkt: augustus 2026 · Lees deze voorwaarden zorgvuldig voordat u SilentHalos gebruikt.", "note": "De Engelse versie is juridisch leidend. Andere talen zijn vertalingen voor gebruiksgemak.", "rights": "© 2026 SilentHalos. Alle rechten voorbehouden.", "privacy": "Privacybeleid", "terms": "Algemene voorwaarden", "sections": [{"title": "1. Aanvaarding van de voorwaarden", "body": "<p>Door SilentHalos of bijbehorende webdiensten te downloaden, installeren of gebruiken, gaat u akkoord met deze voorwaarden. Zo niet, gebruik de dienst dan niet. Deze overeenkomst is met Fenikia International, een in Nederland geregistreerde eenmanszaak.</p>"}, {"title": "2. Beschrijving van de dienst", "body": "<p>SilentHalos is een persoonlijke veiligheidsapp die nood-SMS kan verzenden, live GPS kan delen, audio kan opnemen, foto’s kan vastleggen en noodbewijs beveiligd in de cloud kan opslaan. De dienst vervangt officiële hulpdiensten niet.</p>"}, {"title": "3. Disclaimer noodhulp", "body": "<p>SilentHalos vervangt officiële hulpdiensten niet en neemt niet namens u contact op met politie, ambulance of brandweer. Bel bij levensgevaar rechtstreeks de bevoegde hulpdienst, bijvoorbeeld 112 in de EU. Netwerk, GPS, batterij, machtigingen, besturingssysteem en internet kunnen de werking beïnvloeden.</p>"}, {"title": "4. Verantwoordelijkheden van de gebruiker", "body": "<p>Gebruik de dienst alleen rechtmatig voor persoonlijke veiligheid; verstrek correcte informatie; informeer uw noodcontacten; houd app en apparaat bijgewerkt; gebruik de dienst niet voor intimidatie, misleiding of schade; activeer niet opzettelijk valse SOS-meldingen; beveilig account en apparaat.</p>"}, {"title": "5. Machtigingen en apparaatvereisten", "body": "<p>SilentHalos kan locatie/GPS, microfoon, camera, contacten en SMS-machtigingen nodig hebben. Geweigerde machtigingen kunnen functies verhinderen. U bent verantwoordelijk voor noodzakelijke machtigingen.</p>"}, {"title": "6. GPS-, netwerk- en apparaatbeperkingen", "body": "<p>De werking hangt af van GPS, mobiele netwerken, internet, batterij/power-management, OS-beperkingen en diensten van derden zoals Firebase en Google Maps. Wij garanderen geen exacte locatie, onmiddellijke aflevering of ononderbroken beschikbaarheid.</p>"}, {"title": "7. Nauwkeurigheid en beschikbaarheid", "body": "<p>Wij streven naar betrouwbaarheid maar garanderen geen ononderbroken dienst. Onderhoud, technische storingen en omstandigheden buiten onze controle kunnen tijdelijke uitval of onnauwkeurigheid veroorzaken.</p>"}, {"title": "8. Noodcontacten", "body": "<p>U bent verantwoordelijk voor het kiezen van noodcontacten die meldingen willen en kunnen ontvangen. Wij zijn niet verantwoordelijk wanneer zij onbereikbaar zijn of SMS niet wordt afgeleverd door netwerkproblemen of onjuiste gegevens.</p>"}, {"title": "9. Door gebruiker gegenereerd noodbewijs", "body": "<p>Audio en foto's die tijdens SOS worden vastgelegd zijn uw persoonlijke noodbewijs. Ze kunnen in Firebase worden opgeslagen en via een unieke incidentlink toegankelijk zijn. Deel die link alleen met mensen die u vertrouwt.</p>"}, {"title": "10. Accountbeveiliging", "body": "<p>U bent verantwoordelijk voor de beveiliging van uw apparaat en SilentHalos. Meld vermoedelijke onbevoegde toegang via support@silenthalos.com.</p>"}, {"title": "11. Premiumabonnement", "body": "<p>SilentHalos kan een optioneel premiumabonnement aanbieden. Prijzen, facturering, annulering en beschikbare restituties verlopen via Google Play en zijn onderworpen aan de voorwaarden en het restitutiebeleid van Google Play.</p>"}, {"title": "12. Intellectuele eigendom", "body": "<p>Alle intellectuele eigendomsrechten in SilentHalos, waaronder app, ontwerp, code, merk en content, behoren toe aan Fenikia International. U krijgt alleen een beperkte, niet-exclusieve en niet-overdraagbare licentie voor persoonlijk veiligheidsgebruik; kopiëren, wijzigen, distribueren of reverse-engineeren is niet toegestaan.</p>"}, {"title": "13. Verboden gebruik", "body": "<p>Verboden zijn onder meer valse/misleidende meldingen, onrechtmatige activiteiten, schending van privacy/rechten, onbevoegde toegang, verstoring of overbelasting van infrastructuur en ongeautoriseerde commerci le": "1. Annahme der Bedingungen", "body": "<p>Durch Download, Installation oder Nutzung von SilentHalos oder zugehörigen Webdiensten stimmen Sie diesen Bedingungen zu. Andernfalls nutzen Sie den Dienst nicht. Vertragspartner ist Fenikia International, ein in den Niederlanden registriertes Einzelunternehmen.</p>"}, {"title": "2. Beschreibung des Dienstes", "body": "<p>SilentHalos ist eine persönliche Sicherheits-App, die Notfall-SMS senden, Live-GPS teilen, Audio aufzeichnen, Fotos erfassen und Notfallbeweise sicher in der Cloud speichern kann. Sie ersetzt keine offiziellen Notfalldienste.</p>"}, {"title": "3. Haftungsausschluss für Notfalldienste", "body": "<p>SilentHalos ersetzt keine offiziellen Notfalldienste und kontaktiert Polizei, Rettungsdienst oder Feuerwehr nicht für Sie. Bei Lebensgefahr wenden Sie sich direkt an den zuständigen Notruf, z. B. 112 in der EU. Netzwerk, GPS, Akku, Berechtigungen, Betriebssystem und Internet können die Funktion beeinflussen.</p>"}, {"title": "4. Pflichten des Nutzers", "body": "<p>Nutzen Sie den Dienst nur rechtmäßig zur persönlichen Sicherheit; geben Sie korrekte Informationen an; informieren Sie Notfallkontakte; halten Sie App und Gerät aktuell; nutzen Sie den Dienst nicht für Belästigung, Täuschung oder Schädigung; lösen Sie keine absichtlich falschen SOS-Ereignisse aus; sichern Sie Konto und Gerät.</p>"}, {"title": "5. Berechtigungen und Geräteanforderungen", "body": "<p>SilentHalos kann Standort/GPS, Mikrofon, Kamera, Kontakte und SMS-Berechtigungen benötigen. Verweigerte Berechtigungen können Funktionen verhindern. Sie sind für erforderliche Berechtigungen verantwortlich.</p>"}, {"title": "6. GPS-, Netzwerk- und Gerätebeschränkungen", "body": "<p>Die Funktion hängt u. a. von GPS, Mobilfunk, Internet, Akku/Energieverwaltung, OS-Beschränkungen und Drittanbietern wie Firebase und Google Maps ab. Exakte Standortdaten, sofortige Zustellung und unterbrechungsfreie Verfügbarkeit werden nicht garantiert.</p>"}, {"title": "7. Genauigkeit und Verfügbarkeit", "body": "<p>Wir bemühen uns um Zuverlässigkeit, garantieren jedoch keine ununterbrochene Verfügbarkeit. Wartung, technische Fehler und Umstände außerhalb unserer Kontrolle können vorübergehende Ausfälle oder Ungenauigkeiten verursachen.</p>"}, {"title": "8. Notfallkontakte", "body": "<p>Sie sind für die Auswahl von Notfallkontakten verantwortlich, die Warnungen empfangen können und wollen. Wir haften nicht, wenn Kontakte nicht erreichbar sind oder SMS wegen Netzwerkproblemen oder falscher Angaben nicht zugestellt werden.</p>"}, {"title": "9. Vom Nutzer erzeugte Notfallbeweise", "body": "<p>Während eines SOS erfasste Audioaufnahmen und Fotos sind Ihre persönlichen Notfallbeweise. Sie können in Firebase gespeichert und über einen eindeutigen Vorfallslink erreichbar sein. Teilen Sie diesen nur mit Vertrauenspersonen.</p>"}, {"title": "10. Kontosicherheit", "body": "<p>Sie sind für die Sicherheit Ihres Geräts und von SilentHalos verantwortlich. Melden Sie unbefugten Zugriff an support@silenthalos.com.</p>"}, {"title": "11. Premium-Abonnement", "body": "<p>SilentHalos kann ein optionales Premium-Abonnement anbieten. Preise, Abrechnung, Kündigung und verfügbare Erstattungen werden über Google Play verwaltet und unterliegen dessen Bedingungen und Erstattungsregeln.</p>"}, {"title": "12. Geistiges Eigentum", "body": "<p>Alle Rechte an App, Design, Code, Marke und Inhalten gehören Fenikia International. Sie erhalten nur eine begrenzte, nicht ausschließliche und nicht übertragbare Lizenz zur persönlichen Sicherheitsnutzung; Kopieren, Ändern, Verbreiten oder Reverse Engineering ist nicht gestattet.</p>"}, {"title": "13. Verbotene Nutzung", "body": "<p>Verboten sind falsche oder irreführende Alarme, rechtswidrige Nutzung, Verletzung von Rechten oder Privatsphäre, unbefugter Zugriff, Störung oder Überlastung der Infrastruktur sowie nicht genehmigte kommerzielle Verwertung.</p>"}, {"title": "14. Haftungsbeschränkung", "body": "<p>Soweit gesetzlich zulässig haften SilentHalos und sein Betreiber nicht für indirekte, zufällige, besondere oder Folgeschäden aus Nutzung oder Nichtnutzbarkeit, einschließlich Personenschäden, Sachschäden oder fehlgeschlagener Alarmzustellung. Die Gesamthaftung ist, soweit rechtswirksam, auf den in den 12 Monaten vor dem Anspruch gezahlten Betrag begrenzt.</p>"}, {"title": "15. Aussetzung und Beendigung", "body": "<p>Bei Verstoß gegen diese Bedingungen oder Risiken für Nutzer oder Dienstintegrität können wir den Zugang aussetzen oder beenden. Sie können die Nutzung durch Deinstallation beenden.</p>"}, {"title": "16. Änderungen des Dienstes", "body": "<p>Wir können Funktionen aktualisieren, ändern oder einstellen und versuchen, über wesentliche Änderungen angemessen zu informieren.</p>"}, {"title": "17. Änderungen dieser Bedingungen", "body": "<p>Wir können diese Bedingungen aktualisieren. Das Datum oben zeigt die aktuelle Fassung. Weitere Nutzung nach Inkrafttreten gilt als Zustimmung.</p>"}, {"title": "18. Anwendbares Recht", "body": "<p>Es gilt niederländisches Recht. Zuständig sind die kompetenten Gerichte der Niederlande, soweit zwingendes Verbraucherrecht Ihres Wohnsitzstaats nichts anderes vorsieht.</p>"}, {"title": "19. Kontakt", "body": "<p>Betreiber: Fenikia International, Einzelunternehmen in den Niederlanden. Website: silenthalos.com. E-Mail: support@silenthalos.com.</p>"}]}, "fr": {"dir": "ltr", "legal": "Mentions légales", "title": "Conditions générales", "home": "Accueil", "meta": "Dernière mise à jour : août 2026 · Veuillez lire attentivement ces conditions avant d’utiliser SilentHalos.", "note": "La version anglaise est juridiquement déterminante. Les autres langues sont des traductions de commodité.", "rights": "© 2026 SilentHalos. Tous droits réservés.", "privacy": "Politique de confidentialité", "terms": "Conditions générales", "sections": [{"title": "1. Acceptation des conditions", "body": "<p>En téléchargeant, installant ou utilisant SilentHalos ou ses services web associés, vous acceptez les présentes conditions. Sinon, n’utilisez pas le service. L’accord est conclu avec Fenikia International, entreprise individuelle enregistrée aux Pays-Bas.</p>"}, {"title": "2. Description du service", "body": "<p>SilentHalos est une application de sécurité personnelle pouvant envoyer des SMS d’urgence, partager le GPS en direct, enregistrer de l’audio, capturer des photos et stocker des éléments d’urgence dans le cloud. Elle ne remplace pas les services d’urgence officiels.</p>"}, {"title": "3. Avertissement concernant les services d’urgence", "body": "<p>SilentHalos ne remplace pas les services d’urgence officiels et ne contacte pas la police, l’ambulance ou les pompiers pour vous. En cas de danger vital, contactez directement le service compétent, par exemple le 112 dans l’UE. Réseau, GPS, batterie, autorisations, système et Internet peuvent affecter le fonctionnement.</p>"}, {"title": "4. Responsabilités de l’utilisateur", "body": "<p>Utilisez le service uniquement à des fins légales de sécurité personnelle; fournissez des informations exactes; informez vos contacts; gardez l’application et l’appareil à jour; n’utilisez pas le service pour harceler, tromper ou nuire; ne déclenchez pas volontairement de faux SOS; protégez votre compte et votre appareil.</p>"}, {"title": "5. Autorisations et exigences de l’appareil", "body": "<p>SilentHalos peut nécessiter les autorisations de localisation/GPS, microphone, caméra, contacts et SMS. Le refus peut empêcher certaines fonctions. Vous êtes responsable des autorisations nécessaires.</p>"}, {"title": "6. Limites GPS, réseau et appareil", "body": "<p>Le fonctionnement dépend notamment du GPS, du réseau mobile, d’Internet, de la batterie/gestion d’énergie, des restrictions du système et de services tiers comme Firebase et Google Maps. Nous ne garantissons ni la précision absolue, ni la livraison instantanée, ni une disponibilité continue.</p>"}, {"title": "7. Exactitude et disponibilité", "body": "<p>Nous cherchons à fournir un service fiable sans garantir une disponibilité ininterrompue. Maintenance, défaillances techniques et circonstances hors de notre contrôle peuvent provoquer indisponibilité ou imprécision temporaire.</p>"}, {"title": "8. Contacts d’urgence", "body": "<p>Vous êtes responsable du choix de contacts d’urgence disposés et capables de recevoir les alertes. Nous ne sommes pas responsables s’ils sont injoignables ou si un SMS échoue en raison du réseau ou de coordonnées incorrectes.</p>"}, {"title": "9. Éléments d’urgence générés par l’utilisateur", "body": "<p>Les enregistrements audio et photos capturés pendant un SOS constituent vos éléments d’urgence personnels. Ils peuvent être stockés dans Firebase et accessibles par un lien d’incident unique. Ne partagez ce lien qu’avec des personnes de confiance.</p>"}, {"title": "10. Sécurité du compte", "body": "<p>Vous êtes responsable de la sécurité de votre appareil et de SilentHalos. Signalez tout accès non autorisé à support@silenthalos.com.</p>"}, {"title": "11. Abonnement Premium", "body": "<p>SilentHalos peut proposer un abonnement Premium facultatif. Tarifs, facturation, annulation et remboursements disponibles sont gérés via Google Play et soumis à ses conditions et règles de remboursement.</p>"}, {"title": "12. Propriété intellectuelle", "body": "<p>Tous les droits sur l’application, son design, son code, sa marque et son contenu appartiennent à Fenikia International. Une licence limitée, non exclusive et non transférable vous est accordée pour la sécurité personnelle; copie, modification, distribution ou rétro-ingénierie sont interdites.</p>"}, {"title": "13. Utilisations interdites", "body": "<p>Sont interdits les fausses alertes, usages illégaux, atteintes aux droits ou à la vie privée, accès non autorisé, perturbation ou surcharge de l’infrastructure et exploitation commerciale non autorisée.</p>"}, {"title": "14. Limitation de responsabilité", "body": "<p>Dans la mesure permise par la loi, SilentHalos et son opérateur ne répondent pas des dommages indirects, accessoires, spéciaux ou consécutifs liés à l’utilisation ou l’impossibilité d’utiliser le service, y compris blessures, dommages matériels ou échec d’une alerte. La responsabilité totale est, si légalement valable, limitée au montant payé durant les 12 mois précédant la réclamation.</p>"}, {"title": "15. Suspension et résiliation", "body": "<p>Nous pouvons suspendre ou résilier l’accès en cas de violation ou de risque pour les utilisateurs ou l’intégrité du service. Vous pouvez cesser l’utilisation en désinstallant l’application.</p>"}, {"title": "16. Modifications du service", "body": "<p>Nous pouvons mettre à jour, modifier ou supprimer des fonctions et essayerons de donner un préavis raisonnable des changements importants.</p>"}, {"title": "17. Modifications des présentes conditions", "body": "<p>Nous pouvons mettre à jour ces conditions. La date en haut indique la version actuelle. La poursuite de l’utilisation après leur entrée en vigueur vaut acceptation.</p>"}, {"title": "18. Droit applicable", "body": "<p>Le droit néerlandais s’applique. Les litiges relèvent des tribunaux compétents des Pays-Bas, sauf règles impératives de protection des consommateurs de votre pays de résidence.</p>"}, {"title": "19. Contact", "body": "<p>Opérateur : Fenikia International, entreprise individuelle enregistrée aux Pays-Bas. Site : silenthalos.com. E-mail : support@silenthalos.com.</p>"}]}, "es": {"dir": "ltr", "legal": "Legal", "title": "Términos y condiciones", "home": "Inicio", "meta": "Última actualización: agosto de 2026 · Lee atentamente estas condiciones antes de usar SilentHalos.", "note": "La versión inglesa es jurídicamente vinculante. Las demás versiones son traducciones de cortesía.", "rights": "© 2026 SilentHalos. Todos los derechos reservados.", "privacy": "Política de privacidad", "terms": "Términos y condiciones", "sections": [{"title": "1. Aceptación de los términos", "body": "<p>Al descargar, instalar o usar SilentHalos o sus servicios web asociados, aceptas estas condiciones. Si no estás de acuerdo, no uses el servicio. El acuerdo es con Fenikia International, empresa individual registrada en los Países Bajos.</p>"}, {"title": "2. Descripción del servicio", "body": "<p>SilentHalos es una aplicación de seguridad personal que puede enviar SMS de emergencia, compartir GPS en vivo, grabar audio, capturar fotos y almacenar evidencia de emergencia en la nube. No sustituye a los servicios oficiales de emergencia.</p>"}, {"title": "3. Aviso sobre servicios de emergencia", "body": "<p>SilentHalos no sustituye a los servicios oficiales de emergencia ni contacta por ti con policía, ambulancia o bomberos. En una emergencia vital, contacta directamente con el servicio correspondiente, por ejemplo el 112 en la UE. Red, GPS, batería, permisos, sistema operativo e Internet pueden afectar el funcionamiento.</p>"}, {"title": "4. Responsabilidades del usuario", "body": "<p>Usa el servicio solo para fines legales de seguridad personal; proporciona información correcta; informa a tus contactos; mantén app y dispositivo actualizados; no lo uses para acosar, engañar o causar daño; no actives falsos SOS intencionadamente; protege tu cuenta y dispositivo.</p>"}, {"title": "5. Permisos y requisitos del dispositivo", "body": "<p>SilentHalos puede necesitar permisos de ubicación/GPS, micrófono, cámara, contactos y SMS. Denegar permisos puede impedir ciertas funciones. Eres responsable de mantener los permisos necesarios.</p>"}, {"title": "6. Limitaciones de GPS, red y dispositivo", "body": "<p>El funcionamiento depende de GPS, red móvil, Internet, batería/gestión de energía, restricciones del sistema y servicios de terceros como Firebase y Google Maps. No garantizamos ubicación exacta, entrega inmediata ni disponibilidad ininterrumpida.</p>"}, {"title": "7. Exactitud y disponibilidad", "body": "<p>Buscamos ofrecer un servicio fiable, pero no garantizamos disponibilidad continua. El mantenimiento, fallos técnicos o circunstancias fuera de nuestro control pueden causar indisponibilidad o imprecisión temporal.</p>"}, {"title": "8. Contactos de emergencia", "body": "<p>Eres responsable de elegir contactos de emergencia dispuestos y capaces de recibir alertas. No respondemos si no están disponibles o si falla la entrega del SMS por red o datos incorrectos.</p>"}, {"title": "9. Evidencia de emergencia generada por el usuario", "body": "<p>El audio y las fotos capturados durante un SOS son tu evidencia personal de emergencia. Pueden almacenarse en Firebase y ser accesibles mediante un enlace único. Compártelo solo con personas de confianza.</p>"}, {"title": "10. Seguridad de la cuenta", "body": "<p>Eres responsable de la seguridad de tu dispositivo y de SilentHalos. Informa de accesos no autorizados a support@silenthalos.com.</p>"}, {"title": "11. Suscripción Premium", "body": "<p>SilentHalos puede ofrecer una suscripción Premium opcional. Precios, cobro, cancelación y reembolsos disponibles se gestionan mediante Google Play y se rigen por sus condiciones y política de reembolso.</p>"}, {"title": "12. Propiedad intelectual", "body": "<p>Todos los derechos sobre la aplicación, diseño, código, marca y contenido pertenecen a Fenikia International. Solo se concede una licencia limitada, no exclusiva y no transferible para uso personal de seguridad; no se permite copiar, modificar, distribuir ni realizar ingeniería inversa.</p>"}, {"title": "13. Uso prohibido", "body": "<p>Se prohíben falsas alertas, usos ilegales, vulneración de derechos o privacidad, accesos no autorizados, alteración o sobrecarga de infraestructura y explotación comercial no autorizada.</p>"}, {"title": "14. Limitación de responsabilidad", "body": "<p>En la medida permitida por la ley, SilentHalos y su operador no responden por daños indirectos, incidentales, especiales o consecuentes derivados del uso o imposibilidad de uso, incluidas lesiones, daños materiales o fallo de una alerta. La responsabilidad total, cuando sea legalmente válida, se limita al importe pagado en los 12 meses anteriores a la reclamación.</p>"}, {"title": "15. Suspensión y terminación", "body": "<p>Podemos suspender o terminar el acceso si incumples estas condiciones o existe riesgo para usuarios o integridad del servicio. Puedes dejar de usarlo desinstalando la aplicación.</p>"}, {"title": "16. Cambios en el servicio", "body": "<p>Podemos actualizar, modificar o retirar funciones y procuraremos avisar razonablemente de cambios importantes.</p>"}, {"title": "17. Cambios en estos términos", "body": "<p>Podemos actualizar estas condiciones. La fecha superior indica la versión vigente. Continuar usando el servicio tras su entrada en vigor implica aceptación.</p>"}, {"title": "18. Ley aplicable", "body": "<p>Se aplica la ley de los Países Bajos. Los litigios corresponden a los tribunales competentes neerlandeses, salvo normas imperativas de protección del consumidor de tu país de residencia.</p>"}, {"title": "19. Contacto", "body": "<p>Operador: Fenikia International, empresa individual registrada en los Países Bajos. Sitio: silenthalos.com. Correo: support@silenthalos.com.</p>"}]}, "it": {"dir": "ltr", "legal": "Note legali", "title": "Termini e condizioni", "home": "Home", "meta": "Ultimo aggiornamento: agosto 2026 · Leggi attentamente questi termini prima di utilizzare SilentHalos.", "note": "La versione inglese è il testo giuridicamente prevalente. Le altre lingue sono traduzioni di cortesia.", "rights": "© 2026 SilentHalos. Tutti i diritti riservati.", "privacy": "Informativa sulla privacy", "terms": "Termini e condizioni", "sections": [{"title": "1. Accettazione dei termini", "body": "<p>Scaricando, installando o utilizzando SilentHalos o i servizi web associati accetti questi termini. In caso contrario, non utilizzare il servizio. L’accordo è con Fenikia International, impresa individuale registrata nei Paesi Bassi.</p>"}, {"title": "2. Descrizione del servizio", "body": "<p>SilentHalos è un’app di sicurezza personale che può inviare SMS di emergenza, condividere GPS live, registrare audio, acquisire foto e conservare prove di emergenza nel cloud. Non sostituisce i servizi ufficiali di emergenza.</p>"}, {"title": "3. Esclusione relativa ai servizi di emergenza", "body": "<p>SilentHalos non sostituisce i servizi ufficiali di emergenza e non contatta per tuo conto polizia, ambulanza o vigili del fuoco. In caso di pericolo di vita contatta direttamente il servizio competente, ad esempio il 112 nell’UE. Rete, GPS, batteria, autorizzazioni, sistema operativo e Internet possono influire sul funzionamento.</p>"}, {"title": "4. Responsabilità dell’utente", "body": "<p>Usa il servizio solo legalmente per sicurezza personale; fornisci informazioni corrette; informa i contatti; mantieni app e dispositivo aggiornati; non usarlo per molestare, ingannare o danneggiare; non attivare falsi SOS intenzionalmente; proteggi account e dispositivo.</p>"}, {"title": "5. Autorizzazioni e requisiti del dispositivo", "body": "<p>SilentHalos può richiedere autorizzazioni per posizione/GPS, microfono, fotocamera, contatti e SMS. Negare le autorizzazioni può impedire alcune funzioni. Sei responsabile delle autorizzazioni necessarie.</p>"}, {"title": "6. Limiti di GPS, rete e dispositivo", "body": "<p>Il funzionamento dipende da GPS, rete mobile, Internet, batteria/gestione energia, limiti del sistema e servizi terzi come Firebase e Google Maps. Non garantiamo posizione esatta, consegna immediata o disponibilità continua.</p>"}, {"title": "7. Accuratezza e disponibilità", "body": "<p>Puntiamo a un servizio affidabile ma non garantiamo disponibilità ininterrotta. Manutenzione, guasti tecnici o circostanze fuori dal nostro controllo possono causare indisponibilità o imprecisione temporanea.</p>"}, {"title": "8. Contatti di emergenza", "body": "<p>Sei responsabile della scelta di contatti di emergenza disponibili a ricevere gli avvisi. Non rispondiamo se sono irraggiungibili o se l’SMS non viene consegnato per rete o dati errati.</p>"}, {"title": "9. Prove di emergenza generate dall’utente", "body": "<p>Audio e foto acquisiti durante un SOS sono tue prove personali di emergenza. Possono essere conservati in Firebase e accessibili tramite un link univoco. Condividilo solo con persone fidate.</p>"}, {"title": "10. Sicurezza dell’account", "body": "<p>Sei responsabile della sicurezza del dispositivo e di SilentHalos. Segnala accessi non autorizzati a support@silenthalos.com.</p>"}, {"title": "11. Abbonamento Premium", "body": "<p>SilentHalos può offrire un abbonamento Premium opzionale. Prezzi, fatturazione, cancellazione e rimborsi disponibili sono gestiti tramite Google Play e soggetti alle sue condizioni e politiche di rimborso.</p>"}, {"title": "12. Proprietà intellettuale", "body": "<p>Tutti i diritti sull’app, design, codice, marchio e contenuti appartengono a Fenikia International. È concessa solo una licenza limitata, non esclusiva e non trasferibile per uso personale di sicurezza; non sono consentiti copia, modifica, distribuzione o reverse engineering.</p>"}, {"title": "13. Uso vietato", "body": "<p>Sono vietati falsi allarmi, usi illegali, violazioni di diritti o privacy, accessi non autorizzati, interferenze o sovraccarico dell’infrastruttura e sfruttamento commerciale non autorizzato.</p>"}, {"title": "14. Limitazione di responsabilità", "body": "<p>Nella misura consentita dalla legge, SilentHalos e il suo operatore non rispondono di danni indiretti, incidentali, speciali o consequenziali derivanti dall’uso o impossibilità d’uso, incluse lesioni, danni materiali o mancata consegna di un allarme. La responsabilità totale, se legalmente valida, è limitata a quanto pagato nei 12 mesi precedenti il reclamo.</p>"}, {"title": "15. Sospensione e cessazione", "body": "<p>Possiamo sospendere o terminare l’accesso in caso di violazione o rischio per utenti o integrità del servizio. Puoi cessare l’uso disinstallando l’app.</p>"}, {"title": "16. Modifiche al servizio", "body": "<p>Possiamo aggiornare, modificare o interrompere funzioni e cercheremo di dare ragionevole preavviso dei cambiamenti importanti.</p>"}, {"title": "17. Modifiche ai presenti termini", "body": "<p>Possiamo aggiornare questi termini. La data in alto indica la versione corrente. L’uso continuato dopo l’entrata in vigore costituisce accettazione.</p>"}, {"title": "18. Legge applicabile", "body": "<p>Si applica il diritto dei Paesi Bassi. Le controversie spettano ai tribunali competenti olandesi, salvo norme imperative di tutela del consumatore nel paese di residenza.</p>"}, {"title": "19. Contatti", "body": "<p>Operatore: Fenikia International, impresa individuale registrata nei Paesi Bassi. Sito: silenthalos.com. E-mail: support@silenthalos.com.</p>"}]}, "ru": {"dir": "ltr", "legal": "Правовая информация", "title": "Условия использования", "home": "Главная", "meta": "Последнее обновление: август 2026 · Пожалуйста, внимательно прочитайте эти условия перед использованием SilentHalos.", "note": "Английская версия является юридически определяющей. Другие языки предоставлены как переводы для удобства.", "rights": "© 2026 SilentHalos. Все права защищены.", "privacy": "Политика конфиденциальности", "terms": "Условия использования", "sections": [{"title": "1. Принятие условий", "body": "<p>Скачивая, устанавливая или используя SilentHalos либо связанные веб-сервисы, вы принимаете эти условия. Если вы не согласны, не используйте сервис. Соглашение заключается с Fenikia International, индивидуальным предприятием, зарегистрированным в Нидерландах.</p>"}, {"title": "2. Описание сервиса", "body": "<p>SilentHalos — приложение личной безопасности, которое может отправлять экстренные SMS, передавать GPS в реальном времени, записывать аудио, делать фотографии и хранить экстренные доказательства в облаке. Оно не заменяет официальные экстренные службы.</p>"}, {"title": "3. Отказ от статуса экстренной службы", "body": "<p>SilentHalos не заменяет официальные экстренные службы и не вызывает за вас полицию, скорую или пожарную службу. При угрозе жизни обращайтесь напрямую в соответствующую службу, например 112 в ЕС. Работа зависит от сети, GPS, батареи, разрешений, ОС и Интернета.</p>"}, {"title": "4. Обязанности пользователя", "body": "<p>Используйте сервис только законно для личной безопасности; указывайте верные данные; уведомляйте контакты; обновляйте приложение и устройство; не используйте сервис для преследования, обмана или вреда; не запускайте ложные SOS намеренно; защищайте аккаунт и устройство.</p>"}, {"title": "5. Разрешения и требования устройства", "body": "<p>SilentHalos может требовать разрешения на местоположение/GPS, микрофон, камеру, контакты и SMS. Отказ может отключить функции. Вы отвечаете за необходимые разрешения.</p>"}, {"title": "6. Ограничения GPS, сети и устройства", "body": "<p>Работа зависит от GPS, мобильной сети, Интернета, батареи/энергосбережения, ограничений ОС и сторонних сервисов, включая Firebase и Google Maps. Мы не гарантируем абсолютную точность, мгновенную доставку или непрерывную доступность.</p>"}, {"title": "7. Точность и доступность", "body": "<p>Мы стремимся к надёжности, но не гарантируем непрерывную работу. Техобслуживание, сбои и обстоятельства вне нашего контроля могут вызвать временную недоступность или неточность.</p>"}, {"title": "8. Экстренные контакты", "body": "<p>Вы отвечаете за выбор экстренных контактов, готовых получать уведомления. Мы не отвечаем за их недоступность или сбой SMS из-за сети или неверных данных.</p>"}, {"title": "9. Пользовательские экстренные доказательства", "body": "<p>Аудио и фото, созданные при SOS, являются вашими личными экстренными доказательствами. Они могут храниться в Firebase и быть доступны по уникальной ссылке. Делитесь ею только с доверенными лицами.</p>"}, {"title": "10. Безопасность аккаунта", "body": "<p>Вы отвечаете за безопасность устройства и SilentHalos. О несанкционированном доступе сообщайте на support@silenthalos.com.</p>"}, {"title": "11. Премиум-подписка", "body": "<p>SilentHalos может предлагать дополнительную Premium-подписку. Цена, оплата, отмена и доступные возвраты управляются через Google Play и регулируются его условиями и политикой возврата.</p>"}, {"title": "12. Интеллектуальная собственность", "body": "<p>Все права на приложение, дизайн, код, бренд и контент принадлежат Fenikia International. Вам предоставляется только ограниченная, неисключительная и непередаваемая лицензия для личной безопасности; копирование, изменение, распространение и обратная разработка запрещены.</p>"}, {"title": "13. Запрещённое использование", "body": "<p>Запрещены ложные тревоги, незаконное использование, нарушение прав или приватности, несанкционированный доступ, нарушение или перегрузка инфраструктуры и неразрешённая коммерческая эксплуатация.</p>"}, {"title": "14. Ограничение ответственности", "body": "<p>В максимально допустимой законом степени SilentHalos и оператор не отвечают за косвенный, случайный, специальный или последующий ущерб из-за использования или невозможности использования, включая вред здоровью, имуществу или сбой доставки тревоги. Общая ответственность, если ограничение законно, не превышает сумму, уплаченную за 12 месяцев до требования.</p>"}, {"title": "15. Приостановка и прекращение", "body": "<p>Мы можем приостановить или прекратить доступ при нарушении условий или риске для пользователей либо целостности сервиса. Вы можете прекратить использование, удалив приложение.</p>"}, {"title": "16. Изменения сервиса", "body": "<p>Мы можем обновлять, изменять или прекращать функции и постараемся разумно уведомлять о существенных изменениях.</p>"}, {"title": "17. Изменения условий", "body": "<p>Мы можем обновлять эти условия. Дата наверху показывает актуальную редакцию. Продолжение использования после вступления изменений в силу означает согласие.</p>"}, {"title": "18. Применимое право", "body": "<p>Применяется право Нидерландов. Споры рассматриваются компетентными судами Нидерландов, если обязательные нормы защиты потребителей страны вашего проживания не предусматривают иное.</p>"}, {"title": "19. Контакты", "body": "<p>Оператор: Fenikia International, индивидуальное предприятие, зарегистрированное в Нидерландах. Сайт: silenthalos.com. Email: support@silenthalos.com.</p>"}]}, "tr": {"dir": "ltr", "legal": "Yasal", "title": "Şartlar ve Koşullar", "home": "Ana Sayfa", "meta": "Son güncelleme: Ağustos 2026 · SilentHalos’u kullanmadan önce lütfen bu şartları dikkatlice okuyun.", "note": "İngilizce sürüm hukuken esas metindir. Diğer diller kolaylık amacıyla sağlanan çevirilerdir.", "rights": "© 2026 SilentHalos. Tüm hakları saklıdır.", "privacy": "Gizlilik Politikası", "terms": "Şartlar ve Koşullar", "sections": [{"title": "1. Şartların kabulü", "body": "<p>SilentHalos’u veya ilgili web hizmetlerini indirerek, kurarak ya da kullanarak bu şartları kabul edersiniz. Kabul etmiyorsanız hizmeti kullanmayın. Sözleşme Hollanda’da kayıtlı şahıs işletmesi Fenikia International ile yapılır.</p>"}, {"title": "2. Hizmetin tanımı", "body": "<p>SilentHalos acil SMS gönderebilen, canlı GPS paylaşabilen, ses kaydedebilen, fotoğraf çekebilen ve acil durum kanıtını bulutta saklayabilen kişisel güvenlik uygulamasıdır. Resmi acil servislerin yerine geçmez.</p>"}, {"title": "3. Acil servis feragatnamesi", "body": "<p>SilentHalos resmi acil servislerin yerine geçmez ve sizin adınıza polis, ambulans veya itfaiyeyi aramaz. Hayati acil durumda ilgili resmi servisi doğrudan arayın; AB’de örneğin 112. Ağ, GPS, pil, izinler, işletim sistemi ve internet çalışmayı etkileyebilir.</p>"}, {"title": "4. Kullanıcı sorumlulukları", "body": "<p>Hizmeti yalnızca yasal kişisel güvenlik amaçlarıyla kullanın; doğru bilgiler verin; acil kişilerinizi bilgilendirin; uygulama ve cihazı güncel tutun; taciz, aldatma veya zarar için kullanmayın; kasıtlı sahte SOS oluşturmayın; hesap ve cihaz güvenliğini koruyun.</p>"}, {"title": "5. İzinler ve cihaz gereksinimleri", "body": "<p>SilentHalos konum/GPS, mikrofon, kamera, kişiler ve SMS izinlerine ihtiyaç duyabilir. İzin verilmemesi bazı özellikleri engelleyebilir. Gerekli izinleri sağlamak sizin sorumluluğunuzdadır.</p>"}, {"title": "6. GPS, ağ ve cihaz sınırlamaları", "body": "<p>Çalışma GPS, mobil ağ, internet, pil/güç yönetimi, OS kısıtlamaları ve Firebase/Google Maps gibi üçüncü taraf hizmetlere bağlıdır. Kesin konum, anında teslimat veya kesintisiz erişim garanti edilmez.</p>"}, {"title": "7. Doğruluk ve kullanılabilirlik", "body": "<p>Güvenilir hizmet sunmaya çalışırız ancak sürekli kullanılabilirliği garanti etmeyiz. Bakım, teknik arızalar ve kontrolümüz dışındaki durumlar geçici kesinti veya hataya yol açabilir.</p>"}, {"title": "8. Acil durum kişileri", "body": "<p>Uyarıları almaya istekli ve uygun acil durum kişilerini seçmek sizin sorumluluğunuzdadır. Ulaşılamamaları veya ağ/yanlış bilgi nedeniyle SMS teslim hatasından sorumlu değiliz.</p>"}, {"title": "9. Kullanıcı tarafından oluşturulan acil durum kanıtı", "body": "<p>SOS sırasında yakalanan ses ve fotoğraflar kişisel acil durum kanıtınızdır. Firebase’de saklanabilir ve benzersiz olay bağlantısıyla erişilebilir. Bağlantıyı yalnızca güvendiğiniz kişilerle paylaşın.</p>"}, {"title": "10. Hesap güvenliği", "body": "<p>Cihazınızın ve SilentHalos’un güvenliğinden siz sorumlusunuz. Yetkisiz erişimi support@silenthalos.com adresine bildirin.</p>"}, {"title": "11. Premium abonelik", "body": "<p>SilentHalos isteğe bağlı Premium abonelik sunabilir. Fiyat, faturalandırma, iptal ve mevcut iadeler Google Play üzerinden yönetilir ve Google Play şartları ile iade politikasına tabidir.</p>"}, {"title": "12. Fikri mülkiyet", "body": "<p>Uygulama, tasarım, kod, marka ve içerik dahil tüm fikri mülkiyet hakları Fenikia International’a aittir. Yalnızca kişisel güvenlik için sınırlı, münhasır olmayan ve devredilemez lisans verilir; kopyalama, değiştirme, dağıtma veya tersine mühendislik yasaktır.</p>"}, {"title": "13. Yasaklı kullanım", "body": "<p>Sahte/yanıltıcı uyarılar, yasa dışı kullanım, hak veya gizlilik ihlali, yetkisiz erişim, altyapıyı bozma/aşırı yükleme ve izinsiz ticari kullanım yasaktır.</p>"}, {"title": "14. Sorumluluğun sınırlandırılması", "body": "<p>Yasanın izin verdiği ölçüde SilentHalos ve işletmecisi kullanım veya kullanamama nedeniyle doğan dolaylı, arızi, özel veya sonuçsal zararlardan, kişisel yaralanma, mal zararı veya uyarı teslim hatası dahil, sorumlu değildir. Toplam sorumluluk, hukuken geçerliyse, talepten önceki 12 ayda ödenen tutarla sınırlıdır.</p>"}, {"title": "15. Askıya alma ve sonlandırma", "body": "<p>Şartların ihlali veya kullanıcılar/hizmet bütünlüğü için risk halinde erişimi askıya alabilir veya sonlandırabiliriz. Uygulamayı kaldırarak kullanımı bırakabilirsiniz.</p>"}, {"title": "16. Hizmet değişiklikleri", "body": "<p>Özellikleri güncelleyebilir, değiştirebilir veya sonlandırabiliriz ve önemli değişiklikleri makul ölçüde bildirmeye çalışırız.</p>"}, {"title": "17. Şartlardaki değişiklikler", "body": "<p>Bu şartları güncelleyebiliriz. Üstteki tarih en son sürümü gösterir. Yürürlükten sonra kullanıma devam etmek değişiklikleri kabul etmek anlamına gelir.</p>"}, {"title": "18. Uygulanacak hukuk", "body": "<p>Hollanda hukuku uygulanır. Uyuşmazlıklar, ikamet ülkenizdeki zorunlu tüketici koruma kuralları aksini gerektirmedikçe, Hollanda’daki yetkili mahkemelere tabidir.</p>"}, {"title": "19. İletişim", "body": "<p>İşletmeci: Fenikia International, Hollanda’da kayıtlı şahıs işletmesi. Web: silenthalos.com. E-posta: support@silenthalos.com.</p>"}]}, "zh": {"dir": "ltr", "legal": "法律信息", "title": "条款与条件", "home": "首页", "meta": "最后更新：2026年8月 · 使用 SilentHalos 前请仔细阅读这些条款。", "note": "英文版本为具有法律效力的控制文本。其他语言仅作为便利翻译提供。", "rights": "© 2026 SilentHalos。保留所有权利。", "privacy": "隐私政策", "terms": "条款与条件", "sections": [{"title": "1. 接受条款", "body": "<p>下载、安装或使用 SilentHalos 或相关网络服务即表示您同意这些条款。如不同意，请勿使用。本协议由您与在荷兰注册的个人独资企业 Fenikia International 订立。</p>"}, {"title": "2. 服务说明", "body": "<p>SilentHalos 是个人安全应用，可发送紧急短信、共享实时 GPS、录制音频、拍摄照片并将紧急证据存储在云端。它不能替代官方紧急服务。</p>"}, {"title": "3. 紧急服务免责声明", "body": "<p>SilentHalos 不能替代官方紧急服务，也不会代您联系警方、救护或消防。在危及生命的紧急情况下，请直接联系相应官方服务，例如欧盟的 112。网络、GPS、电量、权限、操作系统和互联网均可能影响功能。</p>"}, {"title": "4. 用户责任", "body": "<p>您应仅将服务用于合法的个人安全目的；提供准确信息；告知紧急联系人；保持应用和设备更新；不得用于骚扰、欺骗或伤害；不得故意触发虚假 SOS；并应保护账户和设备安全。</p>"}, {"title": "5. 权限与设备要求", "body": "<p>SilentHalos 可能需要位置/GPS、麦克风、摄像头、联系人和短信权限。拒绝权限可能导致部分功能不可用。您负责授予并维持必要权限。</p>"}, {"title": "6. GPS、网络与设备限制", "body": "<p>功能依赖 GPS、移动网络、互联网、电量/电源管理、操作系统限制以及 Firebase、Google Maps 等第三方服务。我们不保证位置绝对准确、警报即时送达或服务不中断。</p>"}, {"title": "7. 准确性与可用性", "body": "<p>我们努力提供可靠服务，但不保证持续可用。维护、技术故障及超出我们控制的情况可能导致暂时不可用或不准确。</p>"}, {"title": "8. 紧急联系人", "body": "<p>您负责选择愿意且能够接收警报的紧急联系人。若联系人无法联系或短信因网络/信息错误未送达，我们不承担责任。</p>"}, {"title": "9. 用户生成的紧急证据", "body": "<p>SOS 期间采集的音频和照片属于您的个人紧急证据。它们可能存储在 Firebase，并通过唯一事件链接访问。请仅与您信任的人分享。</p>"}, {"title": "10. 账户安全", "body": "<p>您负责设备及 SilentHalos 的安全。如怀疑未经授权访问，请联系 support@silenthalos.com。</p>"}, {"title": "11. 高级订阅", "body": "<p>SilentHalos 可能提供可选高级订阅。价格、计费、取消及可用退款由 Google Play 管理，并受其条款和退款政策约束。</p>"}, {"title": "12. 知识产权", "body": "<p>应用、设计、代码、品牌和内容的全部知识产权属于 Fenikia International。您仅获得用于个人安全目的的有限、非独占、不可转让许可；不得复制、修改、分发或反向工程。</p>"}, {"title": "13. 禁止使用", "body": "<p>禁止虚假或误导性警报、违法使用、侵犯他人权利或隐私、未经授权访问、干扰或过载基础设施，以及未经授权的商业利用。</p>"}, {"title": "14. 责任限制", "body": "<p>在适用法律允许的最大范围内，SilentHalos 及运营方不对因使用或无法使用服务产生的间接、附带、特殊或后果性损害负责，包括人身伤害、财产损失或警报发送失败。在法律允许的情况下，总责任以提出索赔前 12 个月内您支付的服务费用为限。</p>"}, {"title": "15. 暂停与终止", "body": "<p>若您违反条款或使用行为对用户或服务完整性构成风险，我们可暂停或终止访问。您可随时卸载应用停止使用。</p>"}, {"title": "16. 服务变更", "body": "<p>我们可能更新、修改或停止部分功能，并会尽力对重大变化提供合理通知。</p>"}, {"title": "17. 条款变更", "body": "<p>我们可能更新这些条款。页面顶部日期表示最新版本。变更生效后继续使用即表示接受。</p>"}, {"title": "18. 适用法律", "body": "<p>本条款受荷兰法律管辖。争议由荷兰有管辖权的法院处理，但您居住国的强制性消费者保护法律另有规定的除外。</p>"}, {"title": "19. 联系方式", "body": "<p>运营方：Fenikia International，在荷兰注册的个人独资企业。网站：silenthalos.com。邮箱：support@silenthalos.com。</p>"}]}, "ur": {"dir": "rtl", "legal": "قانونی", "title": "شرائط و ضوابط", "home": "مرکزی صفحہ", "meta": "آخری تازہ کاری: اگست 2026 · SilentHalos استعمال کرنے سے پہلے ان شرائط کو غور سے پڑھیں۔", "note": "انگریزی ورژن قانونی طور پر بنیادی متن ہے۔ دیگر زبانیں سہولت کے لیے ترجمے ہیں۔", "rights": "© 2026 SilentHalos۔ جملہ حقوق محفوظ ہیں۔", "privacy": "رازداری کی پالیسی", "terms": "شرائط و ضوابط", "sections": [{"title": "1. شرائط کی قبولیت", "body": "<p>SilentHalos یا متعلقہ ویب خدمات ڈاؤن لوڈ، انسٹال یا استعمال کرنے سے آپ ان شرائط سے اتفاق کرتے ہیں۔ اگر اتفاق نہیں تو سروس استعمال نہ کریں۔ یہ معاہدہ آپ اور نیدرلینڈز میں رجسٹرڈ واحد ملکیتی کاروبار Fenikia International کے درمیان ہے۔</p>"}, {"title": "2. سروس کی وضاحت", "body": "<p>SilentHalos ذاتی حفاظت کی ایپ ہے جو ہنگامی SMS، براہِ راست GPS، آڈیو ریکارڈنگ، تصاویر اور کلاؤڈ میں ہنگامی شواہد محفوظ کر سکتی ہے۔ یہ سرکاری ہنگامی خدمات کا متبادل نہیں۔</p>"}, {"title": "3. ہنگامی خدمات سے متعلق دستبرداری", "body": "<p>SilentHalos سرکاری ہنگامی خدمات کا متبادل نہیں اور آپ کی طرف سے پولیس، ایمبولینس یا فائر بریگیڈ سے رابطہ نہیں کرتا۔ جان لیوا حالت میں متعلقہ سرکاری سروس سے براہِ راست رابطہ کریں، مثلاً EU میں 112۔ نیٹ ورک، GPS، بیٹری، اجازتیں، آپریٹنگ سسٹم اور انٹرنیٹ کارکردگی کو متاثر کر سکتے ہیں۔</p>"}, {"title": "4. صارف کی ذمہ داریاں", "body": "<p>سروس صرف قانونی ذاتی حفاظتی مقصد کے لیے استعمال کریں؛ درست معلومات دیں؛ ہنگامی رابطوں کو آگاہ کریں؛ ایپ اور ڈیوائس اپ ڈیٹ رکھیں؛ ہراسانی، دھوکہ یا نقصان کے لیے استعمال نہ کریں؛ جان بوجھ کر جھوٹا SOS نہ چلائیں؛ اکاؤنٹ اور ڈیوائس محفوظ رکھیں۔</p>"}, {"title": "5. اجازتیں اور ڈیوائس تقاضے", "body": "<p>SilentHalos کو مقام/GPS، مائیکروفون، کیمرہ، رابطوں اور SMS کی اجازت درکار ہو سکتی ہے۔ اجازت نہ دینے سے کچھ خصوصیات کام نہیں کر سکتیں۔ ضروری اجازتیں برقرار رکھنا آپ کی ذمہ داری ہے۔</p>"}, {"title": "6. GPS، نیٹ ورک اور ڈیوائس کی حدود", "body": "<p>کارکردگی GPS، موبائل نیٹ ورک، انٹرنیٹ، بیٹری/پاور مینجمنٹ، OS پابندیوں اور Firebase/Google Maps جیسی تیسرے فریق خدمات پر منحصر ہے۔ درست مقام، فوری ترسیل یا بلا تعطل دستیابی کی ضمانت نہیں۔</p>"}, {"title": "7. درستگی اور دستیابی", "body": "<p>ہم قابلِ اعتماد سروس کی کوشش کرتے ہیں مگر مسلسل دستیابی کی ضمانت نہیں دیتے۔ دیکھ بھال، تکنیکی خرابی یا ہمارے اختیار سے باہر حالات عارضی عدم دستیابی یا غلطی پیدا کر سکتے ہیں۔</p>"}, {"title": "8. ہنگامی رابطے", "body": "<p>ایسے ہنگامی رابطے منتخب کرنا آپ کی ذمہ داری ہے جو الرٹس وصول کر سکیں۔ ان کے ناقابل رسائی ہونے یا نیٹ ورک/غلط معلومات کی وجہ سے SMS ناکام ہونے کی ذمہ داری ہم پر نہیں۔</p>"}, {"title": "9. صارف کے تیار کردہ ہنگامی شواہد", "body": "<p>SOS کے دوران حاصل آڈیو اور تصاویر آپ کے ذاتی ہنگامی شواہد ہیں۔ یہ Firebase میں محفوظ اور منفرد واقعہ لنک سے قابل رسائی ہو سکتے ہیں۔ لنک صرف قابلِ اعتماد لوگوں سے شیئر کریں۔</p>"}, {"title": "10. اکاؤنٹ سیکیورٹی", "body": "<p>اپنے ڈیوائس اور SilentHalos کی سیکیورٹی آپ کی ذمہ داری ہے۔ غیر مجاز رسائی کی اطلاع support@silenthalos.com پر دیں۔</p>"}, {"title": "11. پریمیم سبسکرپشن", "body": "<p>SilentHalos اختیاری Premium سبسکرپشن پیش کر سکتا ہے۔ قیمت، بلنگ، منسوخی اور دستیاب ریفنڈ Google Play کے ذریعے اور اس کی شرائط و ریفنڈ پالیسی کے مطابق ہوتے ہیں۔</p>"}, {"title": "12. دانشورانہ ملکیت", "body": "<p>ایپ، ڈیزائن، کوڈ، برانڈ اور مواد کے تمام دانشورانہ حقوق Fenikia International کے ہیں۔ صرف ذاتی حفاظت کے لیے محدود، غیر خصوصی اور ناقابل منتقلی لائسنس دیا جاتا ہے؛ کاپی، ترمیم، تقسیم یا ریورس انجینئرنگ ممنوع ہے۔</p>"}, {"title": "13. ممنوع استعمال", "body": "<p>جھوٹے یا گمراہ کن الرٹس، غیر قانونی استعمال، دوسروں کے حقوق یا رازداری کی خلاف ورزی، غیر مجاز رسائی، انفراسٹرکچر میں خلل/بوجھ اور غیر مجاز تجارتی استعمال ممنوع ہے۔</p>"}, {"title": "14. ذمہ داری کی حد", "body": "<p>قانون کی اجازت کی حد تک SilentHalos اور اس کا آپریٹر استعمال یا استعمال نہ کر سکنے سے ہونے والے بالواسطہ، اتفاقی، خصوصی یا نتیجہ خیز نقصانات، بشمول ذاتی چوٹ، املاک نقصان یا الرٹ کی ناکامی، کے ذمہ دار نہیں۔ اگر قانونی طور پر مؤثر ہو تو کل ذمہ داری دعوے سے پہلے 12 ماہ میں ادا شدہ رقم تک محدود ہے۔</p>"}, {"title": "15. معطلی اور خاتمہ", "body": "<p>شرائط کی خلاف ورزی یا صارفین/سروس کی سالمیت کے لیے خطرے پر رسائی معطل یا ختم کی جا سکتی ہے۔ آپ ایپ ان انسٹال کر کے استعمال روک سکتے ہیں۔</p>"}, {"title": "16. سروس میں تبدیلیاں", "body": "<p>ہم خصوصیات بدل، اپ ڈیٹ یا بند کر سکتے ہیں اور اہم تبدیلیوں کی مناسب اطلاع دینے کی کوشش کریں گے۔</p>"}, {"title": "17. ان شرائط میں تبدیلیاں", "body": "<p>ہم ان شرائط کو اپ ڈیٹ کر سکتے ہیں۔ اوپر کی تاریخ تازہ ترین ورژن دکھاتی ہے۔ مؤثر ہونے کے بعد مسلسل استعمال قبولیت سمجھا جائے گا۔</p>"}, {"title": "18. قابل اطلاق قانون", "body": "<p>نیدرلینڈز کا قانون لاگو ہوگا۔ تنازعات نیدرلینڈز کی مجاز عدالتوں کے دائرہ اختیار میں ہوں گے، سوائے آپ کے رہائشی ملک کے لازمی صارف تحفظ قوانین کے۔</p>"}, {"title": "19. رابطہ", "body": "<p>آپریٹر: Fenikia International، نیدرلینڈز میں رجسٹرڈ واحد ملکیتی کاروبار۔ ویب سائٹ: silenthalos.com۔ ای میل: support@silenthalos.com۔</p>"}]}, "ar": {"dir": "rtl", "legal": "قانوني", "title": "الشروط والأحكام", "home": "الرئيسية", "meta": "آخر تحديث: أغسطس 2026 · يرجى قراءة هذه الشروط بعناية قبل استخدام SilentHalos.", "note": "النسخة الإنجليزية هي النص القانوني الحاكم. وتُقدَّم اللغات الأخرى كترجمات للتسهيل.", "rights": "© 2026 SilentHalos. جميع الحقوق محفوظة.", "privacy": "سياسة الخصوصية", "terms": "الشروط والأحكام", "sections": [{"title": "1. قبول الشروط", "body": "<p>بتنزيل SilentHalos أو تثبيته أو استخدامه أو استخدام خدمات الويب المرتبطة به، فإنك توافق على هذه الشروط. وإذا لم توافق، فلا تستخدم الخدمة. يشكل هذا اتفاقاً بينك وبين Fenikia International، وهي منشأة فردية مسجلة في هولندا.</p>"}, {"title": "2. وصف الخدمة", "body": "<p>SilentHalos تطبيق للسلامة الشخصية يمكنه إرسال رسائل SMS للطوارئ، ومشاركة موقع GPS المباشر، وتسجيل الصوت، والتقاط الصور، وحفظ أدلة الطوارئ في السحابة. وهو لا يحل محل خدمات الطوارئ الرسمية.</p>"}, {"title": "3. إخلاء المسؤولية بشأن خدمات الطوارئ", "body": "<p>SilentHalos ليس بديلاً عن خدمات الطوارئ الرسمية ولا يتصل نيابة عنك بالشرطة أو الإسعاف أو الإطفاء. في أي حالة تهدد الحياة، اتصل مباشرة بخدمة الطوارئ الرسمية المناسبة، مثل 112 في الاتحاد الأوروبي. وقد تتأثر الوظائف بالشبكة وGPS والبطارية والصلاحيات ونظام التشغيل والإنترنت.</p>"}, {"title": "4. مسؤوليات المستخدم", "body": "<p>استخدم الخدمة فقط لأغراض قانونية تتعلق بالسلامة الشخصية؛ وقدّم معلومات صحيحة؛ وأبلغ جهات اتصال الطوارئ؛ وحافظ على تحديث التطبيق والجهاز؛ ولا تستخدم الخدمة للمضايقة أو الخداع أو الإضرار؛ ولا تشغّل إنذارات SOS كاذبة عمداً؛ وحافظ على أمان حسابك وجهازك.</p>"}, {"title": "5. الصلاحيات ومتطلبات الجهاز", "body": "<p>قد يتطلب SilentHalos صلاحيات الموقع/GPS والميكروفون والكاميرا وجهات الاتصال وSMS. رفض الصلاحيات قد يمنع بعض الوظائف. وأنت مسؤول عن منح الصلاحيات اللازمة والمحافظة عليها.</p>"}, {"title": "6. قيود GPS والشبكة والجهاز", "body": "<p>تعتمد الوظائف على عوامل منها GPS وشبكة الهاتف والإنترنت والبطارية/إدارة الطاقة وقيود نظام التشغيل وخدمات أطراف ثالثة مثل Firebase وGoogle Maps. ولا نضمن دقة الموقع المطلقة أو وصول التنبيهات فوراً أو التوافر دون انقطاع.</p>"}, {"title": "7. الدقة والتوافر", "body": "<p>نسعى لتقديم خدمة موثوقة لكننا لا نضمن التوافر المستمر. قد تؤدي الصيانة والأعطال التقنية والظروف الخارجة عن سيطرتنا إلى عدم توافر أو عدم دقة مؤقتين.</p>"}, {"title": "8. جهات اتصال الطوارئ", "body": "<p>أنت مسؤول عن اختيار جهات اتصال للطوارئ مستعدة وقادرة على تلقي التنبيهات. ولسنا مسؤولين إذا تعذر الوصول إليهم أو فشل إرسال SMS بسبب الشبكة أو بيانات غير صحيحة.</p>"}, {"title": "9. أدلة الطوارئ التي ينشئها المستخدم", "body": "<p>التسجيلات الصوتية والصور التي يتم التقاطها أثناء SOS هي أدلة الطوارئ الشخصية الخاصة بك. وقد تُخزن في Firebase وتتاح عبر رابط حادث فريد. شارك الرابط فقط مع أشخاص تثق بهم.</p>"}, {"title": "10. أمان الحساب", "body": "<p>أنت مسؤول عن أمان جهازك وتطبيق SilentHalos. إذا اشتبهت بوصول غير مصرح به، تواصل عبر support@silenthalos.com.</p>"}, {"title": "11. الاشتراك المميز", "body": "<p>قد يقدم SilentHalos اشتراكاً مميزاً اختيارياً. تتم إدارة الأسعار والفوترة والإلغاء وعمليات الاسترداد المتاحة عبر Google Play وتخضع لشروطه وسياسة الاسترداد.</p>"}, {"title": "12. الملكية الفكرية", "body": "<p>جميع حقوق الملكية الفكرية في SilentHalos، بما فيها التطبيق والتصميم والكود والعلامة والمحتوى، تعود إلى Fenikia International. ويُمنح لك ترخيص محدود وغير حصري وغير قابل للتحويل لاستخدامه لأغراض السلامة الشخصية فقط؛ ولا يجوز النسخ أو التعديل أو التوزيع أو الهندسة العكسية.</p>"}, {"title": "13. الاستخدام المحظور", "body": "<p>يحظر استخدام SilentHalos لإطلاق تنبيهات كاذبة أو مضللة، أو لأنشطة غير قانونية، أو لانتهاك حقوق أو خصوصية الآخرين، أو للوصول غير المصرح به، أو لتعطيل/إثقال البنية التحتية، أو للاستغلال التجاري دون إذن.</p>"}, {"title": "14. تحديد المسؤولية", "body": "<p>إلى أقصى حد يسمح به القانون، لا يكون SilentHalos أو مشغله مسؤولاً عن الأضرار غير المباشرة أو العرضية أو الخاصة أو التبعية الناشئة عن استخدام الخدمة أو عدم القدرة على استخدامها، بما في ذلك الإصابة الشخصية أو الضرر المادي أو فشل وصول التنبيه. وحيث يكون هذا القيد قانونياً، لا تتجاوز المسؤولية الإجمالية المبلغ المدفوع للخدمة خلال 12 شهراً السابقة للمطالبة.</p>"}, {"title": "15. التعليق والإنهاء", "body": "<p>يجوز لنا تعليق أو إنهاء الوصول عند خرق هذه الشروط أو إذا كان الاستخدام يشكل خطراً على المستخدمين أو سلامة الخدمة. ويمكنك التوقف عن الاستخدام بإزالة التطبيق.</p>"}, {"title": "16. التغييرات على الخدمة", "body": "<p>يجوز لنا تحديث أو تعديل أو إيقاف ميزات من الخدمة، وسنسعى لتقديم إشعار معقول بالتغييرات المهمة.</p>"}, {"title": "17. التغييرات على هذه الشروط", "body": "<p>يجوز لنا تحديث هذه الشروط. يوضح التاريخ أعلى الصفحة أحدث نسخة. ويُعد استمرار الاستخدام بعد سريان التغييرات قبولاً لها.</p>"}, {"title": "18. القانون الحاكم", "body": "<p>تخضع هذه الشروط لقوانين هولندا. وتكون المحاكم المختصة في هولندا صاحبة الاختصاص في النزاعات، ما لم تفرض قوانين حماية المستهلك الإلزامية في بلد إقامتك خلاف ذلك.</p>"}, {"title": "19. التواصل", "body": "<p>المشغّل: Fenikia International، منشأة فردية مسجلة في هولندا. الموقع: silenthalos.com. البريد الإلكتروني: support@silenthalos.com.</p>"}]}};const s=document.getElementById('lang');function A(l){if(!D[l])l='en';const x=D[l];document.documentElement.lang=l;document.documentElement.dir=x.dir;s.value=l;lbl.textContent=x.legal;ttl.textContent=x.title;meta.textContent=x.meta;note.textContent=x.note;rights.textContent=x.rights;pl.textContent=x.privacy;tl.textContent=x.terms;bh.textContent=x.home;topHome.textContent=x.dir==='rtl'?x.home+' →':'← '+x.home;sections.innerHTML=x.sections.map((q,i)=>'<section class="legal-section '+((i===2)?'legal-disclaimer':'')+'"><h2>'+q.title+'</h2>'+q.body+'</section>').join('');localStorage.setItem('silenthalos-language',l)}const saved=localStorage.getItem('silenthalos-language');const b=(navigator.language||'en').toLowerCase().split('-')[0];A(saved&&D[saved]?saved:(D[b]?b:'en'));s.addEventListener('change',e=>A(e.target.value));</script></body></html>
